<!doctype html>
<html lang="en" data-mode="play" data-lang="en" data-st="fixed">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarn Neow – Will your strategy survive?</title>
<meta name="description" content="A free risk-management calculator for forex traders: does your strategy have an edge, and will your account survive it?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mali:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --ok:#1fb86a; --warn:#f5a300; --bad:#e8474c; --none:#8a93a3;
  --maxw:1180px;
}
html[data-mode=play]{
  --bg:#bde7ff; --ink:#23194f; --card:#ffffff; --line:#23194f; --muted:#5d5594;
  --p1:#7c5cff; --p2:#ff6fb5; --p3:#ffd23f; --p4:#2ed3b7; --p5:#3fa7ff;
  --bw:3px; --radius:22px; --shadow:0 5px 0 #23194f; --accent:var(--p1); --accent-ink:#fff;
  --font:'Fredoka','Mali',system-ui,sans-serif; --mono:'Fredoka','Mali',system-ui,sans-serif;
  --c1:#7c5cff; --c2:#ff6fb5; --c3:#2ed3b7; --c4:#ffb400; --grid:rgba(35,25,79,.16); --soft:#f1ecff; --track:#e4dcff;
}
html[data-mode=desk]{
  --bg:#0a0f15; --ink:#d3dce8; --card:#101821; --line:#233142; --muted:#7f8ea1;
  --bw:1px; --radius:2px; --shadow:none; --accent:#ffb000; --accent-ink:#161000;
  --font:'IBM Plex Sans','IBM Plex Sans Thai',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --c1:#4aa3ff; --c2:#ffb000; --c3:#8aa0b5; --c4:#58c9a0; --grid:#1d2a38; --soft:#0b1219; --track:#233142;
  --ok:#2fb877; --warn:#e0a000; --bad:#e5484d;
  --p1:#4aa3ff; --p2:#ffb000; --p3:#ffb000; --p4:#2fb877; --p5:#4aa3ff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);min-height:100vh}
html[data-mode=play] body{background-image:radial-gradient(circle at 22px 22px,rgba(255,255,255,.6) 3px,transparent 4px);background-size:48px 48px}
html[data-mode=desk] body{font-size:14.5px}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.15;margin:0 0 .45em}
p{margin:0 0 .7em}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--p5,#4aa3ff);outline-offset:2px}
html[data-mode=desk] :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
html[data-mode=play] .only-desk,html[data-mode=desk] .only-play{display:none!important}
html[data-mode=desk] #play,html[data-mode=play] #desk{display:none}
body.locked main,body.locked footer{filter:blur(7px);pointer-events:none;user-select:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
html[data-mode=desk] .num,html[data-mode=desk] td.n,html[data-mode=desk] .tile b{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.86em}

/* ============ top bar ============ */
.top{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding:.7rem 1rem;max-width:1600px;margin:0 auto}
html[data-mode=desk] .top{border-bottom:1px solid var(--line);max-width:none;position:sticky;top:0;background:var(--bg);z-index:30}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:1.25rem}
html[data-mode=desk] .brand{font-family:var(--mono);font-size:1.02rem;font-weight:600;letter-spacing:.02em}
.logo{width:34px;height:34px;position:relative;flex:none}
.logo i{position:absolute;width:19px;height:19px;border-radius:6px;border:3px solid var(--ink)}
.logo i:nth-child(1){left:0;top:12px;background:var(--p1,#4aa3ff);transform:rotate(-8deg)}
.logo i:nth-child(2){left:8px;top:0;background:var(--p2,#ffb000);transform:rotate(6deg)}
.logo i:nth-child(3){left:15px;top:14px;background:var(--p3,#8aa0b5);transform:rotate(-3deg)}
html[data-mode=desk] .logo i{border-width:1px;border-radius:1px;border-color:var(--line)}
html[data-mode=desk] .logo i:nth-child(1){background:var(--c1)}
html[data-mode=desk] .logo i:nth-child(2){background:var(--c2)}
html[data-mode=desk] .logo i:nth-child(3){background:var(--c3)}
.controls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.seg{display:inline-flex;border:var(--bw) solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
html[data-mode=desk] .seg{border-radius:2px}
.seg button{border:0;background:transparent;padding:0 .85rem;cursor:pointer;font-weight:600;white-space:nowrap;height:2.15rem;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.l2{display:inline-grid}.l2>span{grid-area:1/1;text-align:center}
html[data-lang=en] .l2>[data-l=th],html[data-lang=th] .l2>[data-l=en]{visibility:hidden}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card)}
html[data-mode=desk] .seg button{padding:0 .7rem;font-weight:500;font-size:.9em;height:1.95rem}
html[data-mode=desk] .seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

/* ============ shared components ============ */
main{max-width:var(--maxw);margin:0 auto;padding:.4rem 1rem 2rem}
html[data-mode=desk] main{max-width:1600px}
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1rem 1.2rem;margin-bottom:1.2rem;min-width:0}
html[data-mode=desk] .card{padding:.9rem 1rem;margin-bottom:1rem}
.card>h2,.card>h3{margin-bottom:.6rem}
html[data-mode=desk] .card>h3,.ph{font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:.5rem;margin:0 0 .7rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:var(--bw) solid var(--line);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:.55rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.alt{background:var(--card);color:var(--ink)}
html[data-mode=desk] .btn{border-radius:2px;box-shadow:none;font-weight:600;padding:.42rem .9rem;border-color:var(--accent)}
html[data-mode=desk] .btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
html[data-mode=desk] .btn:active{transform:none}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
html[data-mode=desk] .chart text{font-family:var(--mono);font-size:10px}
.chart .cap{font-size:12px;fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.82em;color:var(--muted);margin-top:.35rem}
.legend i{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.3em;vertical-align:-.08em}
html[data-mode=desk] .legend i{border-radius:0}
.badge{display:inline-block;padding:.12rem .6rem;border-radius:999px;border:2px solid var(--line);background:var(--p3,#ffb000);font-weight:700;font-size:.82em;color:#23194f}
html[data-mode=desk] .badge{border-radius:2px;border-width:1px;background:transparent;color:var(--accent);border-color:var(--accent);font-family:var(--mono);font-weight:500}
.light{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:2.3rem;font-weight:700;border:var(--bw) solid var(--line);flex:none;color:#fff;background:var(--none);transition:background .25s}
html[data-mode=desk] .light{border-radius:2px;width:56px;height:56px;font-size:1.7rem}
.light[data-v=ok]{background:var(--ok)}.light[data-v=warn]{background:var(--warn);color:#2b1c00}.light[data-v=bad]{background:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin:.9rem 0 .2rem}
.tile{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:.6rem .7rem}
html[data-mode=desk] .tile{border-width:1px;border-radius:2px;padding:.5rem .6rem}
.tile b{display:block;font-size:1.35rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:.8em;color:var(--muted);line-height:1.25;margin-top:.15rem}
details{border-top:2px dashed var(--grid);padding:.6rem 0}
details>summary{cursor:pointer;font-weight:700;list-style-position:inside}
html[data-mode=desk] details{border-top:1px solid var(--line)}
html[data-mode=desk] details>summary{font-weight:500}
details>div{padding-top:.5rem}

/* ============ forms ============ */
.field{margin-bottom:1.15rem}
.frow{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
.frow label{font-weight:600;flex:1}
.help{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--p3,transparent);font-weight:700;cursor:pointer;line-height:1;padding:0;color:#23194f}
html[data-mode=desk] .help{border-radius:2px;border-width:1px;background:transparent;color:var(--muted)}
.helptxt{font-size:.88em;color:var(--muted);background:var(--soft);border-radius:12px;padding:.5rem .7rem;margin:.4rem 0 0}
.numwrap{display:inline-flex;align-items:center;gap:.2rem;border:var(--bw) solid var(--line);border-radius:14px;padding:.1rem .55rem;background:var(--card)}
html[data-mode=desk] .numwrap{border-radius:2px;background:var(--soft)}
.numwrap input{width:5.2em;border:0;background:transparent;text-align:right;font-weight:700;padding:.25rem 0;outline:none}
.numwrap:focus-within{outline:3px solid var(--p5,#ffb000)}
.numwrap i{font-style:normal;color:var(--muted);min-width:1ch}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:99px;background:var(--track);border:2px solid var(--line);margin:.25rem 0;cursor:pointer}
html[data-mode=desk] input[type=range]{height:6px;border-radius:0;border-width:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--p3,#ffb000);border:3px solid var(--line);box-shadow:0 3px 0 var(--line)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--p3,#ffb000);border:3px solid var(--line)}
html[data-mode=desk] input[type=range]::-webkit-slider-thumb{width:12px;height:18px;border-radius:0;border-width:1px;box-shadow:none;background:var(--accent)}
html[data-mode=desk] input[type=range]::-moz-range-thumb{width:10px;height:16px;border-radius:0;border-width:1px;background:var(--accent)}
select,.txt{border:var(--bw) solid var(--line);border-radius:12px;background:var(--card);padding:.4rem .6rem;width:100%}
html[data-mode=desk] select,html[data-mode=desk] .txt{border-radius:2px;background:var(--soft)}

/* ============ playground ============ */
.hero{padding:.6rem 0 1rem}
.hero h1{font-size:clamp(1.9rem,5.4vw,3.2rem);font-weight:700;margin:0 0 .3rem;max-width:18ch}
.hero p{font-size:1.1rem;max-width:56ch;color:var(--muted)}
.play-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:1.4rem;align-items:start}
.col-in{position:sticky;top:.8rem}
.vbar{display:none;position:sticky;top:.5rem;z-index:20;align-items:center;gap:.7rem;background:var(--card);border:var(--bw) solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:.35rem .9rem .35rem .4rem;margin-bottom:1rem}
.vbar .light{width:40px;height:40px;font-size:1.3rem;box-shadow:none}
.vbar b{flex:1;line-height:1.2}
.vrow{display:flex;gap:1rem;align-items:center}
.vrow h2{font-size:1.5rem;margin:0}
.vtext{font-size:1.04rem;margin:.8rem 0 0}
.finding{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.4rem 1.2rem;padding:.9rem 0;border-top:2px dashed var(--grid);align-items:center}
.finding:first-of-type{border-top:0}
.finding h4{font-size:1.1rem;margin-bottom:.25rem}
#deeper .chart{max-width:560px}
.ex{border-top:1px solid var(--line);margin-top:.7rem;padding:.45rem 0 0}
.ex>summary{font-size:.8rem;color:var(--accent);font-family:var(--mono);cursor:pointer;font-weight:500}
.ex p{font-size:.86em;margin:.45rem 0 0;color:var(--ink);line-height:1.5}.ex p b{color:var(--muted);font-weight:600}
.rp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem 1.6rem;margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--line)}
.rp h4{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 .35rem;font-weight:600}
.rp p,.rp li{font-size:.9em;line-height:1.5;margin:0 0 .3rem}.rp ul{margin:0;padding-left:1.05rem}
@media (max-width:760px){.rp{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:1.4rem;align-items:center}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.plan{border:2px solid var(--accent);background:linear-gradient(180deg,rgba(255,176,0,.07),transparent 140px),var(--card)}
.planh{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}
.planh h2{font-family:var(--mono);font-size:1.15rem;color:var(--accent);margin:0}
.pbs{display:flex;gap:.4rem;flex-wrap:wrap}
.plan-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.pi{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.8rem;padding:.8rem .9rem;background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--c1)}
.pi[data-l=must]{border-left-color:var(--bad)}.pi[data-l=should]{border-left-color:var(--warn)}
.pn{font-family:var(--mono);font-size:1.5rem;font-weight:600;color:var(--muted);line-height:1.1}
.pih{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;margin-bottom:.3rem}.pih b{font-size:1.02rem;line-height:1.3}
.pi p{margin:0 0 .35rem;font-size:.92em;line-height:1.5}
.pb{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:.08rem .45rem;border:1px solid var(--c1);color:var(--c1);white-space:nowrap}
.pb[data-l=must]{border-color:var(--bad);color:var(--bad)}.pb[data-l=should]{border-color:var(--warn);color:var(--warn)}
.pres{font-family:var(--mono);font-size:.82em!important;background:var(--bg);border:1px solid var(--line);padding:.35rem .55rem;margin-top:.4rem!important}
.pres span{color:var(--ok);font-weight:600}
@media (max-width:1100px){.plan-list{grid-template-columns:1fr}}
@media (max-width:760px){.rp{grid-template-columns:1fr}}
.ferr{color:var(--bad);font-size:.82em;font-weight:600;margin:.25rem 0 0}
.formrow+.ferr{margin:-.3rem 0 .55rem;text-align:right}
.numwrap.bad,input.txt.bad{outline:2px solid var(--bad);outline-offset:1px}
.inerr{margin-bottom:1rem;font-weight:600}
.tip{position:fixed;z-index:80;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.55);padding:.8rem .95rem;font-size:.88rem;line-height:1.55;pointer-events:none;color:var(--ink)}
.tip h4{font-family:var(--mono);color:var(--accent);font-size:.78rem;margin:0 0 .45rem;text-transform:uppercase;letter-spacing:.05em}
.tip p{margin:0 0 .5rem}.tip p b{color:var(--muted);font-weight:600}
.tip .tex{background:var(--soft);border-left:3px solid var(--accent);padding:.45rem .6rem;margin:0}.tip .tex b{color:var(--accent)}
.formrow[data-tip]{cursor:help;margin-left:-.4rem;margin-right:-.4rem;padding:.15rem .4rem}
.formrow[data-tip]>label,.formrow[data-tip]>span:first-child{cursor:help}
.formrow[data-tip]>label::after,.formrow[data-tip]>span:first-child::after{content:"?";display:inline-grid;place-items:center;width:1rem;height:1rem;margin-left:.35rem;border:1px solid var(--muted);border-radius:50%;font:600 .62rem/1 var(--mono);color:var(--muted);vertical-align:.12em}
.formrow.tipon{background:var(--soft);box-shadow:inset 2px 0 0 var(--accent)}
.formrow.tipon>label::after,.formrow.tipon>span:first-child::after{border-color:var(--accent);color:var(--accent)}
.numwrap.unset:not(.bad),input.txt.unset:not(.bad){outline:2px dashed var(--warn);outline-offset:1px}
.unsetnote{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;margin-bottom:1rem;font-weight:600}
.unsetnote>span:first-child{flex:1;min-width:14em}.unsetnote .ubtns{display:flex;gap:.5rem;flex-wrap:wrap}
html[data-mode=play] .unsetnote .btn{padding:.35rem .9rem}
.bplan{list-style:none;margin:.7rem 0 0;padding:0;display:grid;gap:.55rem}
.bp{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.7rem;align-items:start;border:2px solid var(--line);border-left-width:7px;border-left-color:var(--p4);border-radius:16px;padding:.65rem .8rem;background:var(--soft)}
.bp[data-l=must]{border-left-color:var(--bad)}.bp[data-l=should]{border-left-color:var(--warn)}
.bpn{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--card);border:2px solid var(--line);font-weight:700}
.bph{display:flex;flex-wrap:wrap;gap:.25rem .5rem;align-items:center;margin-bottom:.15rem}.bph b{font-size:1.04rem;line-height:1.3}
.bpl{font-size:.72rem;font-weight:700;padding:.08rem .5rem;border-radius:99px;border:2px solid var(--line);background:var(--p4);color:#23194f;white-space:nowrap}
.bpl[data-l=must]{background:var(--bad);color:#fff}.bpl[data-l=should]{background:var(--warn);color:#2b1c00}
.bp p{margin:0 0 .3rem;font-size:.95em;line-height:1.45}
.bres{display:inline-flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.25rem .6rem;font-weight:600;font-size:.88em!important;margin:.15rem 0 .35rem!important}
.bver{display:inline-flex;gap:.25rem;align-items:center;white-space:nowrap}
.bpb .btn{padding:.35rem .95rem;font-size:.92em}
.iljump{margin-top:.4rem}
.ilsub{font-size:1.08rem;color:var(--muted);margin-bottom:1rem}
.ilrules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin-bottom:.6rem}
.ilrule{display:flex;gap:.6rem;align-items:flex-start;background:var(--p3);border:2px solid var(--line);border-radius:16px;padding:.7rem .8rem;box-shadow:0 3px 0 var(--line)}
.ilrule b{line-height:1.3}.iln,.ilsn{display:inline-grid;place-items:center;flex:none;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--card);border:2px solid var(--line);font-weight:700}
.ilsec{border-top:2px dashed var(--grid);padding-top:1.1rem;margin-top:1.2rem}
.ilsec h3{display:flex;gap:.6rem;align-items:center;font-size:1.3rem}.ilsn{background:var(--p1);color:#fff}
.ilkey{background:var(--soft);border:2px solid var(--line);border-left-width:7px;border-left-color:var(--p2);border-radius:14px;padding:.6rem .8rem;font-weight:600;margin-top:.8rem}
.ilpair{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.6rem 0 1rem}
.ilacc{border:2px solid var(--line);border-radius:16px;padding:.8rem;background:var(--soft)}
.ilacc-h{display:flex;justify-content:space-between;gap:.5rem;font-weight:600}.ilacc-h b{font-size:1.15rem}
.ilbar{height:26px;border:2px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;margin:.5rem 0}.ilbar i{display:block;height:100%}
.ilacc-r{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap}.ilbig{font-size:2rem;font-weight:700;line-height:1}.ilbig small{font-size:.9rem;color:var(--muted);font-weight:600}
.ilacc p{margin:.4rem 0 0}

/* ============ gate ============ */
.gate{position:fixed;inset:0;z-index:100;background:rgba(20,12,50,.72);display:grid;place-items:start center;padding:2rem 1rem;overflow:auto}

.gate-box{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);max-width:520px;width:100%;padding:1.4rem}
.gate-box h2{font-size:1.5rem}
.gate-box.wide{max-width:760px}
.gprog{display:flex;gap:.3rem;margin-bottom:.4rem}.gprog i{flex:1;height:6px;border-radius:9px;background:var(--grid)}.gprog i.done{background:var(--ok)}.gprog i.now{background:var(--accent)}

.gkick{font-size:.82rem;font-weight:700;color:var(--muted);margin:0 0 .3rem;letter-spacing:.02em}
.gnav{display:flex;justify-content:space-between;gap:.6rem;margin-top:1rem}.gnav #gate-go{margin-left:auto}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.6rem 0}
.qopt{border:var(--bw) solid var(--line);background:var(--card);border-radius:14px;padding:.75rem .8rem;font-weight:700;cursor:pointer;text-align:left;line-height:1.3}
html[data-mode=desk] .qopt{border-radius:2px}
.qopt:hover{background:var(--soft)}.qopt[data-r=y]{background:#d6f5e4;color:#0f4a2a;border-color:var(--ok)}.qopt[aria-pressed=true][data-r=n]{background:#ffdcdc;color:#5b1013;border-color:var(--bad)}
.qfb{border-top:2px dashed var(--grid);margin-top:.9rem;padding-top:.9rem}.qv{display:flex;gap:.5rem;align-items:center;font-size:1.05rem;margin-bottom:.6rem}
.gstest{display:flex;gap:.5rem;align-items:flex-start;font-weight:600;padding:.6rem .8rem;border:2px solid var(--line);border-radius:14px;background:var(--soft)}
html[data-mode=desk] .gstest{border-width:1px;border-radius:2px}
.gsscore{font-size:1.15rem;margin:.8rem 0}.gate-box h4{margin:.9rem 0 .4rem;font-size:1.05rem}
.gslist{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}.gslist li{display:flex;gap:.5rem;align-items:flex-start}
.ilcalc>summary{cursor:pointer;font-weight:700}.ilcalc[open]>summary{margin-bottom:.6rem}
.q{border:0;padding:0;margin:1rem 0}
.q legend{font-weight:700;margin-bottom:.4rem;padding:0}
.yn{display:flex;gap:.6rem}
.yn button{flex:1;border:var(--bw) solid var(--line);background:var(--card);border-radius:14px;padding:.55rem;font-weight:700;cursor:pointer}
html[data-mode=desk] .yn button{border-radius:2px}
.yn button[aria-pressed=true][data-a=yes]{background:var(--ok);color:#fff}
.yn button[aria-pressed=true][data-a=no]{background:var(--bad);color:#fff}
.gate-msg{border:2px solid var(--bad);border-radius:14px;padding:.7rem .9rem;margin:.6rem 0 1rem;background:#fff0f0;color:#4d0d10}
html[data-mode=desk] .gate-msg{background:#1c0d0f;color:#ffc3c5;border-width:1px;border-radius:2px}
.gate-msg ul{margin:.4rem 0 0 1.1rem;padding:0}

footer{max-width:var(--maxw);margin:0 auto;padding:0 1rem 2.5rem;color:var(--muted);font-size:.85em}
html[data-mode=desk] footer{max-width:1600px}

<script type="text/plain" id="s-btw">
/* Jarn Neow backtest worker: loads monthly gold files, removes contract-roll jumps, replays the user's rules on 1-minute bars.
   Prices are integers in ticks of $0.10, and 1 pip = 1 tick. */
'use strict';
const cache=new Map();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function decode(buf){
  let p=0;const rv=()=>{let v=0,m=1,b;do{b=buf[p++];v+=(b&127)*m;m*=128;}while(b&128);return v;},zz=v=>(v%2?-(v+1)/2:v/2);

/* ---------- Myfxbook CSV ---------- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],cur='',q=false;
  const push=()=>{row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[];};
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;else if(c===',')row.push(cur),cur='';
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;push();}else cur+=c;}
  if(cur!==''||row.length)push();return rows;}
const REQUIRED=['Open Date','Close Date','Symbol','Action','Units/Lots','Pips','Profit'];
function parseMyfxbook(text){
  const rows=parseCSV(text||'');if(rows.length<2)return{ok:false,error:'empty'};
  const head=rows[0].map(h=>h.trim()),idx={};head.forEach((h,i)=>idx[h]=i);
  for(const r of REQUIRED)if(!(r in idx))return{ok:false,error:'notmyfxbook'};

  for(const r of rows.slice(1)){const m=rx.exec((r[idx['Close Date']]||'').trim());if(m&&+m[1]>12){dmy=true;break;}}
  const pd=s=>{const m=rx.exec((s||'').trim());if(!m)return NaN;const a=+m[1],b=+m[2];return Date.UTC(+m[3],(dmy?b:a)-1,dmy?a:b,+m[4],+m[5],+(m[6]||0));};
  const num=(r,k)=>{if(!(k in idx))return NaN;const v=parseFloat((r[idx[k]]||'').trim());return isNaN(v)?NaN:v;};
  const trades=[];let skipped=0,baddate=0,cash=0;
  for(const r of rows.slice(1)){
    const act=(r[idx['Action']]||'').trim().toLowerCase(),sym=(r[idx['Symbol']]||'').trim();
    if((act!=='buy'&&act!=='sell')||!sym){const pr=num(r,'Profit');if(isFinite(pr))cash+=pr;skipped++;continue;}
    const open=pd(r[idx['Open Date']]),close=pd(r[idx['Close Date']]);

    const t={ticket:(r[idx['Ticket']]||'').trim(),open,close,symbol:sym,side:act,lots:num(r,'Units/Lots'),pips:num(r,'Pips'),profit:num(r,'Profit'),

  trades.sort((a,b)=>a.close-b.close);
  const symbols={};trades.forEach(t=>symbols[t.symbol]=(symbols[t.symbol]||0)+1);
  const balance=cash+trades.reduce((a,x)=>a+x.profit,0);

sc_title:"Expert mode: what it can and can't do",
sc_intro:"Read this once before relying on any number here. Expert mode measures risk: how likely a strategy is to survive, how deep the falls can get, and what size keeps the risk acceptable. It can't tell you whether a strategy will make money, and every result is only as good as the numbers you enter.",
sc_type_h:"First, pick the strategy type that matches how you really trade",
sc_types:[["Fixed stop","One trade at a time, a stop loss set when each trade opens, and about the same % of the account risked every time. Most manual strategies and many EAs."],["Grid / martingale / averaging down","You add orders as price moves against you (same size or bigger) and close them all together at a profit target."],["No hard stop","One position without a stop loss, held until price comes back or until a pain point you choose."],["None of these","Use the closest type and check the list below for what will be off. An EA isn't a type by itself: what matters is how it trades."]],
sc_can_h:"What it can do",
sc_can:[["Fixed-stop strategies","Turns win rate, reward:risk and risk per trade into expectancy with a 95% confidence interval, chance of ruin, drawdown ranges, losing-streak odds, Kelly-based sizing, cost impact and lot size, using 10,000 simulated futures."],["How sure your edge is","Shows how the result changes if your true win rate is lower than your sample suggests, and how many trades you need before the edge is statistically clear."],["Grid, martingale and averaging down","Simulates thousands of price paths through your exact grid: order spacing, lot multiplier, number of orders, profit target and optional final stop. It shows how often cycles win, how big the rare loss is, how far price must move to wipe out the account, the chance of ruin, and which first-order size is safer."],["No hard stop","The same engine for one position without a stop: how far price can go against you before the account is gone, and how often that happens at your size."],["Costs","Spread and commission are in every result. In the grid and no-stop types they're charged on every order."],["Myfxbook history (fixed-stop type)","Converts closed trades into R multiples, resamples them, and checks behaviour: losses bigger than the stop, lot-size consistency, hour and weekday patterns. It also fills in the inputs for you."],["What-if sliders and explanations","On fixed-stop charts, sliders change one input and the chart and its explanation update live. Every card says what it shows, what it means now and what to do."]],
sc_cant_h:"What it can't do",
sc_cant:[["Strategies it doesn't model",[["Variable exits","Trailing stops, partial take-profits, moving the stop to break-even, time exits. The fixed-stop model uses one average win size, so ruin and streak numbers stay roughly right, but growth figures are less reliable, especially for trend systems that live on a few very large winners."],["Several positions open at once","Baskets, hedging, correlated pairs traded together (EURUSD with GBPUSD, say), pyramiding or scaling in. Each trade is treated as separate, but correlated positions tend to lose together. Workaround: enter the total risk of everything you'd have open together as the risk per trade."],["Size that changes with results","Bigger size after wins (anti-martingale), size by confidence or feel, or any rule other than the built-in de-risk rule. Growing lots are modelled only in the grid type."],["Two-way and multi-pair grids","The grid type follows one direction per cycle. Grids that open buys and sells together, or run on several pairs at once, aren't modelled."],["Speed-sensitive strategies","High-frequency scalping, arbitrage and latency trading depend on execution speed, requotes and slippage, and none of that is in the inputs."],["Other instruments","Options, futures rollovers and crypto funding rates aren't modelled. Gold, indices and crypto CFDs work in the fixed-stop type only if every distance uses the same unit as the stop."]]],
["Costs and account mechanics it leaves out",[["Swap (overnight financing)","Not included anywhere. It matters for trades held for days, carry trades and grids that stay open for weeks, and it can turn a small edge negative."],["Slippage and gaps in the fixed-stop type","Every loss is assumed to be exactly the stop plus costs. Weekend gaps, news spikes and thin markets can make real losses bigger. The grid and no-stop types include occasional jumps, but only in a stylised way."],["Margin, leverage and stop-out","Margin isn't checked. Brokers usually close positions when the margin level falls to a set level (often 20–50%), so a real account is closed out before the 'wiped out' point shown in the grid and no-stop types. Set the ruin line at your stop-out level."],["Deposits, withdrawals, taxes and fees","The balance changes only through trading. Withdrawals shrink the buffer and make ruin more likely."],["Account currency","Money figures assume the value per pip you enter is in your account currency. If it's wrong, every lot size and money figure is wrong."]]],
["Limits of the statistics",[["The future may not match your numbers","Everything assumes your win rate, payoff and costs stay the same. Markets change and strategies stop working; the app can stress-test that but can't predict it. The confidence interval covers luck in a small sample, not a market that changes."],["Independent trades","Fixed-stop trades are simulated as independent. Real losing streaks can cluster (a bad month for your style), so real streaks and drawdowns can be longer."],["Small samples","Under about 30 trades the uncertainty is huge; under 100, treat every number as a rough guide."],["Backtest quality","The app can't see overfitting, look-ahead bias, unrealistic fills or cherry-picked periods. Unrealistic inputs give confident, wrong answers."],["Price model in the grid and no-stop types","Prices are simulated from the daily range you enter, as a plain random walk or with fat tails and short trends. They aren't fitted to your pair's history, and they have no edge in either direction, so a real edge such as mean reversion won't show up. Real markets have moved far beyond both models (the Swiss franc in January 2015, for example)."],["Simulation noise","Results come from random simulations, so they shift a little between settings. Events rarer than about 1 in 1,000 may not appear: 0% means 'not seen in the simulation', not 'impossible'."]]],
["Myfxbook import",[["Closed trades only","Open positions, pending orders and floating losses at export time are ignored, so an account carrying a large open loss can look healthy."],["Estimated stop","If you don't know the stop, it's estimated from the median losing trade, so R values are approximate."],["It can't tell what kind of strategy made the history","A grid or martingale account can look like an excellent fixed-stop history with a very high win rate. Choose the strategy type yourself; history analysis applies to the fixed-stop type only."],["Mixed accounts","Several strategies or EAs on one account are blended into one set of statistics. Pick one symbol, or export one strategy per file."]]],
["What it isn't",[["Not a profit predictor or a signal","It never tells you what, when or whether to trade. A good result means 'survivable if your numbers are true', not 'profitable'."],["Not a test of you under pressure","It assumes the rules are followed exactly. Fear, revenge trading, moved stops, platform outages and broker problems aren't modelled."],["Not financial advice","Jarn Neow is an educational tool. Trading leveraged products carries a high risk of loss."]]]],
sc_ok:"I understand",sc_again:"Reopen this any time from the Strategy type panel."

sc_types:[["มี Stop loss ตายตัว","เปิดทีละไม้ ตั้ง Stop loss ตั้งแต่เปิดไม้ และเสี่ยงต่อไม้เป็น % ของพอร์ตใกล้เคียงกันทุกครั้ง กลยุทธ์แบบเทรดเองส่วนใหญ่และ EA หลายตัวอยู่ในกลุ่มนี้"],["กริด / มาร์ติงเกล / ถัวเฉลี่ยขาลง","เปิดออเดอร์เพิ่มเมื่อราคาวิ่งสวน (ขนาดเท่าเดิมหรือใหญ่ขึ้น) แล้วปิดทั้งหมดพร้อมกันที่เป้ากำไร"],["ไม่มี Stop loss","ถือไม้เดียวโดยไม่มี Stop loss จนกว่าราคาจะกลับมา หรือจนถึงจุดที่คุณยอมตัด"],["ไม่ตรงกับแบบไหนเลย","เลือกแบบที่ใกล้ที่สุด แล้วดูรายการด้านล่างว่าส่วนไหนจะคลาดเคลื่อน EA ไม่ได้เป็นประเภทในตัวเอง สิ่งที่สำคัญคือ EA เทรดอย่างไร"]],

sc_can:[["กลยุทธ์ที่มี Stop loss ตายตัว","แปลง Win rate, Reward:risk และความเสี่ยงต่อไม้ เป็นค่าคาดหวังพร้อมช่วงความเชื่อมั่น 95% โอกาสพอร์ตแตก ช่วงการลดลงของพอร์ต โอกาสแพ้ติดกัน ขนาดไม้ตามหลัก Kelly ผลของต้นทุน และขนาดล็อต จากการจำลองอนาคต 10,000 แบบ"],["ความได้เปรียบชัวร์แค่ไหน","แสดงว่าผลจะเปลี่ยนอย่างไรถ้า Win rate จริงต่ำกว่าที่ตัวอย่างบอก และต้องเทรดกี่ไม้ความได้เปรียบจึงชัดเจนทางสถิติ"],["กริด มาร์ติงเกล และการถัวเฉลี่ยขาลง","จำลองเส้นทางราคาหลายพันแบบผ่านกริดตามที่คุณตั้ง: ระยะห่าง ตัวคูณล็อต จำนวนออเดอร์ เป้ากำไร และจุดตัดขาดทุนสุดท้าย (ถ้ามี) แสดงว่ารอบชนะบ่อยแค่ไหน การขาดทุนที่นานๆ เกิดทีใหญ่เท่าไร ราคาต้องวิ่งสวนไกลแค่ไหนพอร์ตจึงหมด โอกาสพอร์ตแตก และขนาดออเดอร์แรกเท่าไรที่ปลอดภัยกว่า"],["ไม่มี Stop loss","ใช้ระบบเดียวกันกับการถือไม้เดียวโดยไม่มี Stop loss: ราคาวิ่งสวนได้ไกลแค่ไหนก่อนพอร์ตหมด และเกิดบ่อยแค่ไหนที่ขนาดของคุณ"],["ต้นทุน","สเปรดและคอมมิชชั่นอยู่ในผลทุกตัว แบบกริดและแบบไม่มี Stop loss คิดทุกออเดอร์"],["ประวัติ Myfxbook (แบบมี Stop loss ตายตัว)","แปลงไม้ที่ปิดแล้วเป็นหน่วย R สุ่มซ้ำ และตรวจพฤติกรรม: ขาดทุนเกิน Stop loss ความสม่ำเสมอของขนาดล็อต และรูปแบบตามชั่วโมงและวัน พร้อมกรอกค่าให้"],["แถบเลื่อน What-if และคำอธิบาย","ในกราฟแบบมี Stop loss ตายตัว แถบเลื่อนเปลี่ยนค่าทีละตัว แล้วกราฟกับคำอธิบายอัปเดตทันที ทุกการ์ดบอกว่าแสดงอะไร ตอนนี้หมายความว่าอย่างไร และควรทำอะไร"]],
sc_cant_h:"สิ่งที่ทำไม่ได้",
sc_cant:[["กลยุทธ์ที่ยังไม่รองรับ",[["การออกที่ไม่ตายตัว","Trailing stop, ปิดกำไรบางส่วน, เลื่อน Stop loss ไปจุดคุ้มทุน, ปิดตามเวลา แบบ Stop loss ตายตัวใช้ขนาดกำไรเฉลี่ยค่าเดียว ตัวเลขพอร์ตแตกและการแพ้ติดกันยังใกล้เคียง แต่ตัวเลขการเติบโตเชื่อถือได้น้อยลง โดยเฉพาะระบบตามเทรนด์ที่อยู่ได้ด้วยไม้กำไรใหญ่ไม่กี่ไม้"],["ถือหลายไม้พร้อมกัน","เปิดเป็นชุด, Hedge, เทรดคู่เงินที่เคลื่อนไหวคล้ายกันพร้อมกัน (เช่น EURUSD กับ GBPUSD), เพิ่มไม้ตามเทรนด์ หรือทยอยเข้า แต่ละไม้ถูกนับแยกกัน แต่ไม้ที่สัมพันธ์กันมักขาดทุนพร้อมกัน ทางเลี่ยง: ใส่ความเสี่ยงรวมของทุกไม้ที่จะเปิดพร้อมกันเป็นความเสี่ยงต่อไม้"],["ขนาดไม้ที่เปลี่ยนตามผล","เพิ่มขนาดหลังชนะ (Anti-martingale), ปรับขนาดตามความมั่นใจหรือความรู้สึก หรือกฎอื่นนอกจากกฎลดความเสี่ยงที่มีให้ การเพิ่มล็อตรองรับเฉพาะแบบกริด"],["กริดสองทางและกริดหลายคู่เงิน","แบบกริดตามราคาทางเดียวต่อรอบ กริดที่เปิด Buy และ Sell พร้อมกัน หรือรันหลายคู่เงินพร้อมกัน ยังไม่รองรับ"],["กลยุทธ์ที่พึ่งความเร็ว","สกัลป์ความถี่สูง อาร์บิทราจ และการเทรดที่อาศัยความหน่วงต่ำ ขึ้นกับความเร็วในการส่งคำสั่ง Requote และ Slippage ซึ่งไม่มีอยู่ในค่าที่ใส่"],["สินทรัพย์อื่น","ออปชัน การ Rollover สัญญาฟิวเจอร์ส และ Funding rate ของคริปโต ไม่รองรับ ทองคำ ดัชนี และ CFD คริปโต ใช้ได้เฉพาะแบบ Stop loss ตายตัว และระยะทุกช่องต้องใช้หน่วยเดียวกับ Stop loss"]]],
["ต้นทุนและกลไกบัญชีที่ไม่ได้คิด",[["Swap (ค่าถือข้ามคืน)","ไม่ได้คิดในส่วนไหนเลย มีผลกับไม้ที่ถือหลายวัน การเทรดเก็บดอกเบี้ย และกริดที่เปิดค้างเป็นสัปดาห์ และอาจทำให้ความได้เปรียบเล็กๆ กลายเป็นติดลบ"],["Slippage และราคากระโดดในแบบ Stop loss ตายตัว","ทุกไม้ที่แพ้ถือว่าเสียเท่ากับ Stop loss บวกต้นทุนพอดี ราคากระโดดช่วงสุดสัปดาห์ ข่าว และตลาดที่สภาพคล่องต่ำ อาจทำให้ขาดทุนจริงมากกว่านั้น แบบกริดและแบบไม่มี Stop loss มีราคากระโดดเป็นครั้งคราว แต่เป็นแบบจำลองอย่างง่าย"],["มาร์จิ้น เลเวอเรจ และ Stop-out","ไม่ได้ตรวจมาร์จิ้น โบรกเกอร์มักปิดออเดอร์เมื่อระดับมาร์จิ้นต่ำถึงเกณฑ์ (มัก 20–50%) บัญชีจริงจึงถูกปิดก่อนจุด 'เสียพอร์ตทั้งหมด' ที่แสดงในแบบกริดและแบบไม่มี Stop loss ให้ตั้งเส้นพอร์ตแตกตามระดับ Stop-out ของคุณ"],["ฝาก ถอน ภาษี และค่าธรรมเนียม","ยอดเงินเปลี่ยนจากการเทรดเท่านั้น การถอนเงินทำให้เงินกันชนน้อยลงและพอร์ตแตกง่ายขึ้น"],["สกุลเงินของบัญชี","ตัวเลขเงินถือว่ามูลค่าต่อ pip ที่ใส่เป็นสกุลเงินของบัญชี ถ้าใส่ผิด ขนาดล็อตและตัวเลขเงินทุกตัวจะผิด"]]],
["ข้อจำกัดของสถิติ",[["อนาคตอาจไม่ตรงกับตัวเลขของคุณ","ทุกอย่างถือว่า Win rate ผลตอบแทน และต้นทุนคงที่ ตลาดเปลี่ยน และกลยุทธ์เลิกได้ผลได้ แอปทดสอบสถานการณ์นี้ได้แต่ทำนายไม่ได้ ช่วงความเชื่อมั่นครอบคลุมแค่ดวงจากตัวอย่างน้อย ไม่ครอบคลุมตลาดที่เปลี่ยนไป"],["แต่ละไม้เป็นอิสระต่อกัน","แบบ Stop loss ตายตัวจำลองแต่ละไม้แยกจากกัน การแพ้ติดกันจริงอาจเกาะกลุ่ม (เดือนที่ตลาดไม่เข้ากับสไตล์คุณ) จึงอาจแพ้ติดกันนานและพอร์ตลดลงลึกกว่าที่จำลอง"],["ตัวอย่างน้อย","ต่ำกว่าประมาณ 30 ไม้ ความไม่แน่นอนสูงมาก ต่ำกว่า 100 ไม้ ให้ถือว่าทุกตัวเลขเป็นแนวทางคร่าวๆ"],["คุณภาพของ Backtest","แอปมองไม่เห็น Overfitting การใช้ข้อมูลอนาคต ราคาเข้าออกที่ไม่สมจริง หรือการเลือกช่วงเวลาที่ดี ค่าที่ไม่สมจริงให้คำตอบที่ดูมั่นใจแต่ผิด"],["แบบจำลองราคาในแบบกริดและแบบไม่มี Stop loss","ราคาจำลองจากช่วงราคาต่อวันที่ใส่ แบบสุ่มล้วน หรือแบบมีราคากระโดดและเทรนด์สั้นๆ ไม่ได้ปรับตามประวัติจริงของคู่เงิน และไม่เข้าข้างฝั่งใด ความได้เปรียบจริงเช่นการกลับตัวสู่ค่าเฉลี่ยจะไม่ปรากฏ ตลาดจริงเคยวิ่งไกลกว่าทั้งสองแบบมาก (เช่น ฟรังก์สวิสในเดือนมกราคม 2015)"],["ความคลาดเคลื่อนจากการจำลอง","ผลมาจากการสุ่มจำลอง จึงขยับเล็กน้อยเมื่อเปลี่ยนค่า เหตุการณ์ที่เกิดน้อยกว่าราว 1 ใน 1,000 อาจไม่ปรากฏเลย 0% หมายถึง 'ไม่เจอในการจำลอง' ไม่ใช่ 'เป็นไปไม่ได้'"]]],

<script id="s-charts">
const CH=(function(){

const f1=n=>Math.round(n*10)/10;
function niceStep(range,target){const raw=range/target,pow=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/pow;return(f<1.5?1:f<3?2:f<7?5:10)*pow;}
function ticks(lo,hi,count){if(!(hi>lo))return[lo];const st=niceStep(hi-lo,count||5),a=[];for(let v=Math.ceil(lo/st-1e-9)*st;v<=hi+1e-9;v+=st)a.push(+v.toFixed(10));return a;}

const pathOf=(pts,f)=>pts.map((p,i)=>(i?'L':'M')+f1(f.X(p[0]))+' '+f1(f.Y(p[1]))).join('');

  (o.hlines||[]).forEach(h=>ys.push(h.y));(o.vlines||[]).forEach(v=>xs.push(v.x));
  let xlo=o.xlo!==undefined?o.xlo:Math.min(...xs),xhi=o.xhi!==undefined?o.xhi:Math.max(...xs);
  let ylo=o.ylo!==undefined?o.ylo:Math.min(...ys),yhi=o.yhi!==undefined?o.yhi:Math.max(...ys);
  if(o.ylo===undefined||o.yhi===undefined){const pad=(yhi-ylo||1)*0.06;if(o.ylo===undefined)ylo-=pad;if(o.yhi===undefined)yhi+=pad;}

/* generic plot: series (lines), areas, dots, hlines, vlines, markers */
function plot(o){

  (o.areas||[]).forEach(a=>{if(!a.upper.length)return;const up=a.upper.map((p,i)=>(i?'L':'M')+f1(f.X(p[0]))+' '+f1(f.Y(p[1]))).join(''),lo=a.lower.slice().reverse().map(p=>'L'+f1(f.X(p[0]))+' '+f1(f.Y(p[1]))).join('');
    s+=`<path d="${up}${lo}Z" style="fill:${a.color||'var(--c1)'};opacity:${a.op||0.15};stroke:none"/>`;});
  (o.hlines||[]).forEach(h=>{const y=f.Y(h.y);s+=`<line x1="${f.m.l}" x2="${f.W-f.m.r}" y1="${f1(y)}" y2="${f1(y)}" style="stroke:${h.color||'var(--muted)'};stroke-width:1.2;${h.dash===false?'':'stroke-dasharray:4 3'}"/>`;});
  (o.vlines||[]).forEach(v=>{const x=f.X(v.x);s+=`<line x1="${f1(x)}" x2="${f1(x)}" y1="${f.m.t}" y2="${f.H-f.m.b}" style="stroke:${v.color||'var(--muted)'};stroke-width:1.2;${v.dash===false?'':'stroke-dasharray:4 3'}"/>`;});
  (o.series||[]).forEach(se=>{s+=`<path d="${pathOf(se.pts,f)}" style="fill:none;stroke:${se.color||'var(--c1)'};stroke-width:${se.w||1.5};opacity:${se.op||1};stroke-linejoin:round;stroke-linecap:round"/>`;});
  (o.dots||[]).forEach(d=>{s+=`<circle cx="${f1(f.X(d.x))}" cy="${f1(f.Y(d.y))}" r="${d.r||2.6}" style="fill:${d.color||'var(--c1)'};opacity:${d.op||0.75}"/>`;});
  s+='</g>';
  (o.hlines||[]).forEach(h=>{if(h.label)s+=`<text x="${f.W-f.m.r-3}" y="${f1(f.Y(h.y)+(h.below?12:-4))}" text-anchor="end" style="fill:${h.color||'var(--muted)'}">${esc(h.label)}</text>`;});
  (o.vlines||[]).forEach(v=>{if(v.label)s+=`<text x="${f1(f.X(v.x)+4)}" y="${f.m.t+10}" style="fill:${v.color||'var(--muted)'}">${esc(v.label)}</text>`;});
  (o.markers||[]).forEach(d=>{const x=f.X(d.x),y=f.Y(d.y);s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${d.r||5}" style="fill:${d.color||'var(--c2)'};stroke:var(--card);stroke-width:2"/>`;
    if(d.label)s+=`<text class="cap" x="${f1(x+(d.dx||0))}" y="${f1(y+(d.dy===undefined?-9:d.dy))}" text-anchor="${d.anchor||'middle'}">${esc(d.label)}</text>`;});
  return wrap(f,s,o.label);}
/* histogram: bins [{x0,x1,count}] */
function histo(o){
  const bins=o.bins,xlo=bins[0].x0,xhi=bins[bins.length-1].x1,ymax=Math.max(1,...bins.map(b=>b.count))*1.1,f=frame(o,xlo,xhi,0,ymax);
  let s=axes(f,Object.assign({yfmt:v=>Number.isInteger(v)?v:''},o));
  bins.forEach(b=>{const x=f.X(b.x0)+0.5,w=Math.max(1,f.X(b.x1)-f.X(b.x0)-1),y=f.Y(b.count);
    s+=`<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(f.Y(0)-y)}" style="fill:${o.colorFn?o.colorFn(b):'var(--c1)'};opacity:.85"/>`;});
  (o.vlines||[]).forEach(v=>{const x=f.X(v.x);s+=`<line x1="${f1(x)}" x2="${f1(x)}" y1="${f.m.t}" y2="${f.H-f.m.b}" style="stroke:${v.color||'var(--ink)'};stroke-width:1.4;${v.dash?'stroke-dasharray:4 3':''}"/>`;
    if(v.label)s+=`<text x="${f1(x+(v.anchor==='end'?-4:4))}" y="${f.m.t+10}" text-anchor="${v.anchor||'start'}" style="fill:${v.color||'var(--ink)'}">${esc(v.label)}</text>`;});
  return wrap(f,s,o.label);}
/* categorical bars: items [{label,value,color,faint}] */
function bars(o){
  const it=o.items,vals=it.map(i=>i.value),lo=Math.min(0,...vals),hi=Math.max(0,...vals),pad=(hi-lo||1)*0.12,f=frame(o,0,it.length,lo<0?lo-pad:0,o.ymax!==undefined?o.ymax:hi+pad);
  let s=axes(f,Object.assign({noXAxis:true},o)),bw=f.pw/it.length;
  s+=`<line x1="${f.m.l}" x2="${f.W-f.m.r}" y1="${f1(f.Y(0))}" y2="${f1(f.Y(0))}" style="stroke:var(--muted)"/>`;
  it.forEach((b,i)=>{const x=f.m.l+i*bw+bw*0.14,w=bw*0.72,y0=f.Y(0),y=f.Y(b.value);
    s+=`<rect x="${f1(x)}" y="${f1(Math.min(y,y0))}" width="${f1(w)}" height="${f1(Math.max(1,Math.abs(y-y0)))}" style="fill:${b.color||(b.value<0?'var(--c2)':'var(--c1)')};opacity:${b.faint?0.35:0.9}"/>`;
    if(!o.every||i%o.every===0)s+=`<text x="${f1(x+w/2)}" y="${f.H-f.m.b+14}" text-anchor="middle">${esc(b.label)}</text>`;
    if(o.valFmt&&bw>22)s+=`<text x="${f1(x+w/2)}" y="${f1(b.value<0?y+11:y-3)}" text-anchor="middle" style="font-size:9.5px">${esc(o.valFmt(b.value))}</text>`;});
  (o.hlines||[]).forEach(h=>{const y=f1(f.Y(h.y));s+=`<line x1="${f.m.l}" x2="${f.W-f.m.r}" y1="${y}" y2="${y}" style="stroke:${h.color||'var(--ink)'};stroke-width:1.6;stroke-dasharray:5 3"/>`;});

/* fan chart of simulated equity curves (values are multiples of starting balance) */

   `<rect x="${f1(X(o.lo))}" y="${y-9}" width="${f1(Math.max(2,X(o.hi)-X(o.lo)))}" height="18" rx="4" style="fill:${strad?'var(--warn)':'var(--ok)'};opacity:.9"/>`+
   `<line x1="${f1(X(0))}" x2="${f1(X(0))}" y1="${y-20}" y2="${y+20}" style="stroke:var(--ink);stroke-width:2"/><text x="${f1(X(0))}" y="${y-24}" text-anchor="middle" class="cap">0</text>`+
   `<circle cx="${f1(X(o.pt))}" cy="${y}" r="6" style="fill:var(--card);stroke:var(--ink);stroke-width:2.5"/>`+
   `<text x="${f1(X(o.lo))}" y="${y+32}" text-anchor="middle" class="cap">${esc(o.fmt(o.lo))}</text><text x="${f1(X(o.hi))}" y="${y+32}" text-anchor="middle" class="cap">${esc(o.fmt(o.hi))}</text>`;

<script id="s-play">

    e.hidden=!bad;e.textContent=bad?t('err_field',{min:FIELDS[k].min,max:FIELDS[k].max}):'';if(bad)names.push(document.querySelector('label[for=n_'+k+']').textContent.trim());});

function plan(){

  const a=A,acts=[],quick=s=>SFX.analyzeSimple(s,{sims:800});let base=a,alt=false,headroom=null;
  if(gate==='nn')acts.push({id:'gnn',lvl:'must'});else if(gate==='bt')acts.push({id:'gbt',lvl:'should'});else if(gate==='ft')acts.push({id:'gft',lvl:'should'});

  else if(a.E<=0){alt=true;acts.push({id:'noedge',lvl:'must'});SFX.suggestFix(a).forEach(f=>acts.push({id:f.id,lvl:'must',opt:true,value:f.value,changes:f.changes,from:a,after:quick(mergeSt(f.changes))}));const o=acts.find(x=>x.changes);if(o)base=o.after;}
  else if(a.ruinP>0.05||a.dd95>0.25||(a.K>0&&a.risk>a.K/2)){

  if(!alt&&a.p<1&&base.E>0&&(base.Elo<=0||base.n<30)){const need=base.nNeeded?Math.max(30,base.nNeeded):(base.Elo<=0?null:30);
    acts.push({id:'sample',lvl:'should',value:need,from:base,after:need?quick(Object.assign({},base.st,{n:need})):null});}
  if(a.p<1&&a.E>0&&a.p-a.be<0.03)acts.push({id:'thin',lvl:'should'});
  const fixes=acts.filter(x=>x.lvl!=='habit').length;

    if(!acts.some(x=>x.changes)&&base.Elo>0){let mx=st.risk;for(const gq of SFX.RISK_GRID){if(gq>st.risk){if(SFX.simulate({sampler:SFX.binarySampler(a.p,a.b),risk:gq/100,n:a.H,sims:800,ruin:0.5,seed:42}).ruinProb<=0.05)mx=gq;else break;}}headroom=mx;if(mx>st.risk)acts.push({id:'room',lvl:'habit',value:mx});}
    const rk=base.st.risk/100,k=base.streakK;if(k>0)acts.push({id:'streak',lvl:'habit',k,drop:1-Math.pow(1-rk,k),risk:base.st.risk});

  const chained=acts.filter(x=>x.after&&!x.opt),last=chained.length?chained[chained.length-1]:null,fin=alt?(acts.find(x=>x.changes)||{}).after||null:(last?last.after:null);
  const ord={must:0,should:1,habit:2};acts.forEach((x,i)=>x.i=i);acts.sort((x,y)=>ord[x.lvl]-ord[y.lvl]||x.i-y.i);

function showErr(msg){D.err=msg;$('file-status').innerHTML=msg?`<div class="errnote">${esc(msg)}</div>`:'';}
function readFile(file){
  if(!file)return;if(file.size>25*1024*1024){showErr(t('err_big'));return;}
  const fr=new FileReader();
  fr.onload=()=>{
    const p=SFX.parseMyfxbook(String(fr.result));
    if(!p.ok){D.parsed=null;D.fileId++;D.res=null;showErr(t('err_'+p.error));$('symwrap').hidden=true;analyze();return;}
    D.parsed=p;D.fileId++;D.fileName=file.name;showErr(null);
    const syms=Object.keys(p.symbols).sort((a,b)=>p.symbols[b]-p.symbols[a]);D.symbol=syms[0];
    const sel=$('symsel');sel.innerHTML=syms.map(s=>`<option value="${esc(s)}">${esc(s)} (${p.symbols[s]})</option>`).join('');sel.value=D.symbol;
    $('symwrap').hidden=syms.length<2;if(!(D.pv>0)){const v=SFX.toR(p.trades.filter(x=>x.symbol===D.symbol),1,true).vpp;if(isFinite(v)&&v>0){D.pv=+v.toPrecision(4);$('d-pv').value=D.pv;}}autoFill();statusLine();hint();analyze();};
  fr.onerror=()=>showErr(t('err_read'));fr.readAsText(file);}
function autoFill(){
  const tr=curTrades();D.filled=null;if(tr.length<5)return;
  const lp=tr.filter(x=>x.pips<0).map(x=>-x.pips);if(!lp.length)return;
  const sl=+SFX.median(lp).toPrecision(4);if(!(sl>0))return;
  D.sl=sl;$('d-sl').value=sl;
  const st=SFX.tradeStats(SFX.toR(tr,sl,D.net==='net').R),f={sl,n:st.n};
  D.n=Math.max(5,st.n);$('d-n').value=D.n;
  if(st.avgWin>0&&st.avgLoss<0){D.wr=SFX.clamp(Math.round(st.winRate*1000)/10,1,100);D.rr=SFX.clamp(+(st.avgWin/-st.avgLoss).toFixed(2),0.05,100);$('d-wr').value=D.wr;$('d-rr').value=D.rr;f.wr=D.wr;f.rr=D.rr;}
  const lg=tr.filter(x=>x.profit<0&&isFinite(x.gain)&&x.gain<0).map(x=>-x.gain);
  if(lg.length>=3){const r=SFX.clamp(+SFX.median(lg).toFixed(2),0.05,100);D.risk=r;$('d-risk').value=r;f.risk=r;}
  const days=(tr[tr.length-1].close-tr[0].open)/864e5*5/7;if(days>=1){const d=SFX.clamp(+(tr.length/days).toFixed(1),0.1,200);D.tpd=d;$('d-tpd').value=d;f.tpd=d;}
  D.spread=0;D.comm=0;$('d-spread').value=0;$('d-comm').value=0;
  if(D.net==='gross'){D.net='net';$('d-net').value='net';}
  const bal=D.parsed.balance;if(isFinite(bal)&&bal>0){D.bal=Math.round(bal*100)/100;$('d-bal').value=D.bal;f.bal=D.bal.toLocaleString('en-US');}
  ['wr','rr','n','risk','tpd','sl','pv','spread','comm'].forEach(k=>{if(k in f||k==='spread'||k==='comm'||k==='pv'||k==='sl')dtouch[k]=1;});if(f.bal)dtouch.bal=1;
  D.filled=f;revalidate();}
function curTrades(){return D.parsed?D.parsed.trades.filter(x=>x.symbol===D.symbol):[];}
function statusLine(){

function schedule(){clearTimeout(timer);timer=setTimeout(analyze,220);}

function costR(){if(!(D.sl>0))return 0;let c=D.spread>0?D.spread/D.sl:0;if(D.comm>0&&D.pv>0)c+=D.comm/D.pv/D.sl;return c;}
function runSim(p,riskPct,extra){if(!extra&&D._memo){const k=p+'|'+riskPct,c=D._memo.get(k);if(c)return c;const r=runSimRaw(p,riskPct);D._memo.set(k,r);return r;}return runSimRaw(p,riskPct,extra);}
function runSimRaw(p,riskPct,extra){const m=D._pay;return SFX.simulate(Object.assign({sampler:SFX.binPay(p,m.W,-m.L),risk:riskPct/100,n:D.hor,sims:D._sub||1000,ruin:D.ruin/100,seed:21,fixed:D.sizing==='fixed',deriskAfter:D.dAfter,deriskCut:D.dCut/100},extra||{}));}
function computeModel(){
  const p=D.wr/100,b=D.rr,c=costR(),W=b-c,L=1+c,q=1-p,H=D.hor;D._pay={W,L};D._memo=new Map();
  const Eg=SFX.expectancy(p,b),En=p*W-q*L,ci=SFX.wilson(p,D.n),eAt=x=>x*W-(1-x)*L,Elo=eAt(ci[0]),Ehi=eAt(ci[1]);

  const grid=[0.25,0.5,1,1.5,2,3,4,5,7.5,10,15,20],row=(r,pp)=>{const s=runSim(pp===undefined?p:pp,r);return{risk:r,ruin:s.ruinProb,med:SFX.quantile(s.fin,0.5),dd95:SFX.quantile(s.dd,0.95)};};
  const sweep=grid.map(r=>row(r));

function computeHistory(){

const money=v=>{if(!isFinite(v))return v<0?'−∞':'∞';const a=Math.abs(v);return(v<0?'−':'')+a.toLocaleString('en-US',{minimumFractionDigits:a>=1000?0:2,maximumFractionDigits:a>=1000?0:2});};

function gParams(){const ns=D.stype==='nostop',pv=D.pv>0?D.pv:10;return{ns,pv,pvSet:D.pv>0,M:ns?1:D.gMax,mult:ns?1:D.gMult,step:ns?0:D.gStep,cpl:(D.spread>0?D.spread*pv:0)+(D.comm>0?D.comm:0)};}
function gLadder(G){
  const L=[];let Lt=0,S=0,cost=0;

  const lossAt=d=>{let i=0;while(i+1<L.length&&L[i+1].d<=d)i++;const r=L[i];return r.Lt*(d-r.a)*G.pv+r.cost;};
  const distTo=target=>{for(let i=0;i<L.length;i++){const r=L[i],end=i+1<L.length?L[i+1].d:Infinity,d=r.a+(target-r.cost)/(r.Lt*G.pv);if(d>=r.d&&d<end)return Math.max(0,d);if(d<r.d&&r.loss>=target)return r.d;}return Infinity;};
  const last=L[L.length-1],stopD=D.gSl>0?last.d+D.gSl:null,stopLoss=stopD!==null?lossAt(stopD):null;

  const E=sum(pn)/N,se=SFX.sd(pn)/Math.sqrt(N),avgW=w.length?sum(w)/w.length:0,avgL=l.length?sum(l)/l.length:0,worst=Math.min(...pn);

    ['Median cycle # of ruin',ra.length?ra[Math.floor(ra.length/2)]:'–'],['Equity p5 / p50 / p95',`${fq(0.05)} / ${fq(0.5)} / ${fq(0.95)}`],['Max DD p50 / p95 / p99',`${dq(0.5)} / ${dq(0.95)} / ${dq(0.99)}`]];
  const step=Math.max(1,Math.round(H/120)),rc=[],wc=[];let a=0,b=0;for(let i=0;i<=H;i+=step){while(a<ra.length&&ra[a]<=i)a++;while(b<wa.length&&wa[b]<=i)b++;rc.push([i,a/N*100]);wc.push([i,b/N*100]);}
  if(rc[rc.length-1][0]!==H){rc.push([H,ra.length/N*100]);wc.push([H,wa.length/N*100]);}
  const rcv=CH.plot({w:520,h:230,series:[{pts:rc,color:'var(--warn)',w:2.2},{pts:wc,color:'var(--bad)',w:2.2}],hlines:[{y:5,color:'var(--muted)',label:'5%'}],xlo:0,xhi:H,ylo:0,yhi:Math.max(10,Math.min(100,sim.ruinProb*125)),yfmt:v=>(+v.toFixed(1))+'%',xlabel:'cycles',ylabel:'cumulative probability',label:'Cumulative ruin and wipe-out probability'});
  const sw=g.sweep,sv=CH.plot({w:520,h:230,series:[{pts:sw.map(x=>[x.lot,x.ruin*100]),color:'var(--warn)',w:2},{pts:sw.map(x=>[x.lot,x.wipe*100]),color:'var(--bad)',w:2}],dots:sw.map(x=>({x:x.lot,y:x.ruin*100,r:3,color:'var(--warn)',op:1})),hlines:[{y:5,color:'var(--muted)',label:'5%'}],markers:[{x:D.gLot,y:sim.ruinProb*100,color:'var(--accent)',r:5,label:'you'}],xlo:0,ylo:0,yhi:100,xfmt:v=>(+v.toFixed(3))+'',yfmt:v=>v+'%',xlabel:'first order size (lots)',ylabel:'probability over '+H+' cycles',label:'Ruin probability by first order size'});
  const swRows=sw.map(x=>[lf(x.lot)+(Math.abs(x.lot-D.gLot)<1e-9?' (you)':''),pc(x.ruin),pc(x.wipe)]);
  return`<section class="dsec" data-step="4">${gHead('Survival and sizing')}<div class="dgrid">
  <div class="s5">${card('Survival metrics',kv(rows)+note('gn_surv'))}</div>
  <div class="s7">${card('Cumulative P(ruin) by cycle',ch(rcv)+lg([['var(--warn)',t('lg_g_ruin',{x:D.ruin})],['var(--bad)',t('lg_g_wipe')]])+note('gn_ruincurve'))}</div>
  <div class="s7">${card('P(ruin) vs first order size',ch(sv)+lg([['var(--warn)',t('lg_g_ruin',{x:D.ruin})],['var(--bad)',t('lg_g_wipe')]])+note('gn_sweep'))}</div>
  <div class="s5">${card('Size table ('+H+' cycles)',tbl(['First order','P(ruin)','P(wiped out)'],swRows)+note('gn_sizetab'))}</div></div></section>`;}

function wiRange(k){const b=D[k];switch(k){

  case'n':return{min:10,max:Math.max(2000,Math.ceil(b*2/10)*10),step:10,f:v=>String(v)};
  case'hor':return{min:50,max:1000,step:10,f:v=>v+' trades'};

  case'spread':{const mx=Math.max(D.sl*0.2,b*3,1),st=+(Math.pow(10,Math.floor(Math.log10(mx/200)))).toPrecision(1);return{min:0,max:+(Math.ceil(mx/st)*st).toFixed(6),step:st,f:v=>String(+(+v).toFixed(4))};}

  }finally{D.model=sv.model;D._pay=sv.pay;D.sims=sv.sims;D._sub=0;EXPL=sv.ex;keys.forEach(k=>{D[k]=save[k];});D._wi=false;}
  const n=box.querySelector('.winote'),rs=box.querySelector('.wireset');n.hidden=!diff.length;rs.hidden=!diff.length;box.classList.toggle('on',!!diff.length);box.closest('.card').classList.toggle('wion',!!diff.length);

function renderScope(){
  const li=(a,ic,cls)=>`<ul class="sclist ${cls}">${a.map(x=>`<li><i aria-hidden="true">${ic}</i><span><b>${esc(x[0])}.</b> ${esc(x[1])}</span></li>`).join('')}</ul>`;
  $('scope-body').innerHTML=`<h2 id="scope-title">${esc(t('sc_title'))}</h2><p>${esc(t('sc_intro'))}</p>`+
    `<h3>${esc(t('sc_type_h'))}</h3>${li(tl('sc_types'),'›','typ')}`+
    `<h3 class="can">${esc(t('sc_can_h'))}</h3>${li(tl('sc_can').concat([tl('sc_bt_can')]),'✓','can')}`+
    `<h3 class="cant">${esc(t('sc_cant_h'))}</h3>`+(()=>{const a=tl('sc_cant').slice();a.splice(a.length-1,0,tl('sc_bt_cant'));return a;})().map(g=>`<h4>${esc(g[0])}</h4>${li(g[1],'✕','cant')}`).join('');}
function openScope(after){scopeBack=document.activeElement;scopeAfter=after||null;renderScope();const sc=$('scope');sc.hidden=false;sc.scrollTop=0;document.body.classList.add('locked');$('scope-ok').focus({preventScroll:true});}
function closeScope(){const sc=$('scope');if(sc.hidden)return;sc.hidden=true;if($('gate').hidden)document.body.classList.remove('locked');
  if(scopeBack&&scopeBack.focus&&document.contains(scopeBack))scopeBack.focus({preventScroll:true});const f=scopeAfter;scopeAfter=null;if(f)f();}
$('scope-ok').addEventListener('click',closeScope);
$('open-scope').addEventListener('click',()=>openScope());
$('scope').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeScope();}
  if(e.key==='Tab'){const f=[...$('scope').querySelectorAll('button')];if(f.length===1){e.preventDefault();f[0].focus();}}});

/* ----- mode ----- */
function renderActive(){
  if(root.dataset.mode==='play'){PLAY.render();}else{DESK.refreshText();}}
function updateShareHash(){if(root.dataset.mode==='play')try{history.replaceState(null,'','#'+location.hash.slice(1).replace(/^$/,'')+'');}catch(e){}}
function setMode(m,save){
  const prev=root.dataset.mode;root.dataset.mode=m;
  document.querySelectorAll('#seg-mode button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));
  if(window.__sfxTip)window.__sfxTip.hide();
  if(m==='desk'){toDesk();DESK.refreshText();const nudge=()=>{if(window.matchMedia('(max-width:700px)').matches&&!sess.get('sfx_dn')){$('desk-nudge').hidden=false;sess.set('sfx_dn','1');}};
    if(prev!=='desk'){if(save)openScope(nudge);else nudge();}}
  else{$('desk-nudge').hidden=true;closeScope();toPlay();PLAY.render();}
  window.scrollTo(0,0);}
document.querySelectorAll('.langseg button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang,true)));
document.querySelectorAll('#seg-mode button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode,true)));
document.querySelectorAll('#seg-layout button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#seg-layout button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  DESK.setLayout(b.dataset.layout);store.set('sfx_layout',b.dataset.layout);}));
$('goto-desk').addEventListener('click',()=>setMode('desk',true));
$('btn-explain').addEventListener('click',()=>{const b=$('btn-explain'),on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));DESK.setExplain(on);store.set('sfx_explain',on?'1':'0');});
$('dn-go').addEventListener('click',()=>{$('desk-nudge').hidden=true;});
$('dn-back').addEventListener('click',()=>setMode('play',true));
$('dn-copy').addEventListener('click',()=>{const url=location.href.split('#')[0]+'#m=desk&l='+LANG,b=$('dn-copy');
  const done=()=>{b.textContent=t('share_done');setTimeout(()=>b.textContent=t('dn_copy'),1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,()=>window.prompt(t('dn_copy'),url));else window.prompt(t('dn_copy'),url);});

/* ----- boot ----- */
PLAY.init();DESK.init();ILL.init();
/* ---------- input explanations (hover / focus) ---------- */
(function(){
  const map={'d-wr':'wr','d-rr':'rr','d-n':'n','d-tpd':'tpd','d-risk':'risk','d-sizing':'sizing','d-dafter':'dafter','d-dcut':'dcut','d-bal':'bal','d-sl':'sl','d-spread':'spread','d-comm':'comm','d-pv':'pv','d-hor':'hor','d-ruin':'ruin','d-net':'net','symsel':'sym','g-lot':'glot','g-step':'gstep','g-mult':'gmult','g-max':'gmax','g-tp':'gtp','g-sl':'gsl','g-vol':'gvol','g-auto':'gauto','g-mkt':'gmkt'};
  const tip=$('tip');let cur=null;
  const rows=[];
  Object.keys(map).forEach(id=>{const el=$(id);if(!el)return;const row=el.closest('.formrow');row.dataset.tip=map[id];el.setAttribute('aria-describedby','tip');rows.push(row);});
  const sr=document.querySelector('#p-sim [data-i18n=d_sims]');if(sr){const row=sr.closest('.formrow');row.dataset.tip='sims';row.tabIndex=0;rows.push(row);}
  function fill(row){const k=row.dataset.tip,lab=row.querySelector('label,span');
    tip.innerHTML=`<h4>${esc(lab?lab.textContent.trim():'')}</h4><p>${esc(t('tip_'+k+'_w'))}</p><p><b>${esc(t('tip_why'))}</b> ${esc(t('tip_'+k+'_y'))}</p><p class="tex"><b>${esc(t('tip_ex'))}</b> ${esc(t('tip_'+k+'_e'))}</p>`;}
  function place(row){
    const r=row.getBoundingClientRect(),aside=row.closest('.d-aside').getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
    tip.hidden=false;const wide=vw>=1024;
    if(wide){tip.style.width='360px';const h=tip.offsetHeight;tip.style.left=Math.min(aside.right+12,vw-372)+'px';tip.style.top=Math.max(8,Math.min(r.top-10,vh-h-8))+'px';}
    else{tip.style.width=Math.min(vw-24,r.width+16)+'px';const h=tip.offsetHeight;tip.style.left=Math.max(12,r.left-8)+'px';tip.style.top=(r.bottom+h+8<vh?r.bottom+6:Math.max(8,r.top-h-6))+'px';}}
  function show(row){if(document.documentElement.dataset.mode!=='desk')return;cur=row;rows.forEach(x=>x.classList.toggle('tipon',x===row));fill(row);place(row);}
  function hide(row){if(row&&row!==cur)return;cur=null;tip.hidden=true;rows.forEach(x=>x.classList.remove('tipon'));}
  rows.forEach(row=>{
    row.addEventListener('mouseenter',()=>show(row));
    row.addEventListener('mouseleave',()=>{const a=document.activeElement;if(a&&row.contains(a))return;hide(row);});
    row.addEventListener('focusin',()=>show(row));
    row.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!(a&&row.contains(a))&&!row.matches(':hover'))hide(row);},0);});});
  const re=()=>{if(cur)place(cur);};
  window.addEventListener('scroll',re,{passive:true});window.addEventListener('resize',re);
  document.querySelectorAll('.d-aside').forEach(a=>a.addEventListener('scroll',re,{passive:true}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hide(cur);});
  window.__sfxTip={refresh:()=>{if(cur){fill(cur);place(cur);}},hide:()=>hide(cur)};
})();

const h=PLAY.readHash();
let lang=h.l||store.get('sfx_lang');if(!lang)lang=(navigator.language||'').toLowerCase().indexOf('th')===0?'th':'en';
if(store.get('sfx_explain')==='0'){$('btn-explain').setAttribute('aria-pressed','false');DESK.setExplain(false);}
const layout=store.get('sfx_layout');
if(layout==='guided'||layout==='full'){document.querySelectorAll('#seg-layout button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.layout===layout)));DESK.setLayout(layout);}
/* every page load starts in Beginner; only a shared link that asks for Expert (#m=desk) opens it, once */
let mode=h.m==='desk'?'desk':'play';store.del('sfx_mode');
if(h.m){try{const q=new URLSearchParams(location.hash.slice(1));q.delete('m');const rest=q.toString();history.replaceState(null,'',location.href.split('#')[0]+(rest?'#'+rest:''));}catch(e){}}
root.dataset.mode=mode;
toDesk();
document.querySelectorAll('#seg-mode button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
setLang(lang,false);
if(mode==='desk')DESK.analyze();else PLAY.render();
openGate();
window.__sfx={PLAY,DESK,setLang,setMode,MISSING};
})();
</script>
