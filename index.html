*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);min-height:100vh}
html[data-mode=play] body{background-color:var(--bg);background-image:radial-gradient(circle at 18px 26px,rgba(255,244,201,.55) 1.2px,transparent 2px),radial-gradient(circle at 70px 90px,rgba(217,196,240,.4) 1px,transparent 1.6px),radial-gradient(circle at 120px 40px,rgba(173,239,74,.35) 1px,transparent 1.6px),radial-gradient(ellipse 80% 50% at 50% 115%,rgba(181,41,239,.38),transparent 70%),radial-gradient(ellipse 60% 40% at 0% 0%,rgba(240,90,166,.18),transparent 70%);background-size:140px 140px,190px 190px,230px 230px,100% 100vh,100% 100vh;background-repeat:repeat,repeat,repeat,no-repeat,no-repeat;background-attachment:scroll,scroll,scroll,fixed,fixed}
html[data-mode=desk] body{font-size:14.5px}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.15;margin:0 0 .45em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
p{margin:0 0 .7em}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--p5,#4aa3ff);outline-offset:2px}
html[data-mode=desk] :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
html[data-mode=play] .only-desk,html[data-mode=desk] .only-play{display:none!important}
html[data-mode=desk] #play,html[data-mode=play] #desk{display:none}
body.locked main,body.locked footer{filter:blur(7px);pointer-events:none;user-select:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
html[data-mode=desk] .num,html[data-mode=desk] td.n,html[data-mode=desk] .tile b{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.86em}

/* ============ top bar ============ */
.top{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding:.7rem 1rem;max-width:1600px;margin:0 auto}
html[data-mode=desk] .top{border-bottom:1px solid var(--line);max-width:none;position:sticky;top:0;background:var(--bg);z-index:30}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:1.25rem}
html[data-mode=desk] .brand{font-family:var(--mono);font-size:1.02rem;font-weight:600;letter-spacing:.02em}
.logo{width:34px;height:34px;position:relative;flex:none}
.logo i{position:absolute;width:19px;height:19px;border-radius:6px;border:3px solid var(--ink)}
.logo i:nth-child(1){left:0;top:12px;background:var(--p1,#4aa3ff);transform:rotate(-8deg)}
.logo i:nth-child(2){left:8px;top:0;background:var(--p2,#ffb000);transform:rotate(6deg)}
.logo i:nth-child(3){left:15px;top:14px;background:var(--p3,#8aa0b5);transform:rotate(-3deg)}
html[data-mode=desk] .logo i{border-width:1px;border-radius:1px;border-color:var(--line)}
html[data-mode=desk] .logo i:nth-child(1){background:var(--c1)}
html[data-mode=desk] .logo i:nth-child(2){background:var(--c2)}
html[data-mode=desk] .logo i:nth-child(3){background:var(--c3)}
.controls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.seg{display:inline-flex;border:var(--bw) solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
html[data-mode=desk] .seg{border-radius:2px}
.seg button{border:0;background:transparent;padding:0 .85rem;cursor:pointer;font-weight:600;white-space:nowrap;height:2.15rem;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.l2{display:inline-grid}.l2>span{grid-area:1/1;text-align:center}
html[data-lang=en] .l2>[data-l=th],html[data-lang=th] .l2>[data-l=en]{visibility:hidden}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card)}
html[data-mode=desk] .seg button{padding:0 .7rem;font-weight:500;font-size:.9em;height:1.95rem}
html[data-mode=desk] .seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

/* ============ shared components ============ */
main{max-width:var(--maxw);margin:0 auto;padding:.4rem 1rem 2rem}
html[data-mode=desk] main{max-width:1600px}
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1rem 1.2rem;margin-bottom:1.2rem;min-width:0}
html[data-mode=desk] .card{padding:.9rem 1rem;margin-bottom:1rem}
.card>h2,.card>h3{margin-bottom:.6rem}
html[data-mode=desk] .card>h3,.ph{font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:.5rem;margin:0 0 .7rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:var(--bw) solid var(--line);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:.55rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.alt{background:var(--card);color:var(--ink)}
html[data-mode=desk] .btn{border-radius:2px;box-shadow:none;font-weight:600;padding:.42rem .9rem;border-color:var(--accent)}
html[data-mode=desk] .btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
html[data-mode=desk] .btn:active{transform:none}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart{padding-bottom:.9em}
/* chart labels are sized for the width the chart is drawn at (see CHFIT), so they stay readable on a phone */
.chart text{font-family:var(--font);font-size:var(--cf,11px);fill:var(--muted)}
html[data-mode=desk] .chart text{font-family:var(--mono);font-size:var(--cf,10px)}
.chart .cap{font-size:calc(var(--cf,11px)*1.09);fill:var(--ink)}
.chart text.bv{font-size:calc(var(--cf,11px)*.95)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.82em;color:var(--muted);margin-top:.35rem}
.legend i{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.3em;vertical-align:-.08em}
html[data-mode=desk] .legend i{border-radius:0}
.badge{display:inline-block;padding:.12rem .6rem;border-radius:999px;border:2px solid var(--line);background:var(--p3,#ffb000);font-weight:700;font-size:.82em;color:#2a0a45}
html[data-mode=desk] .badge{border-radius:2px;border-width:1px;background:transparent;color:var(--accent);border-color:var(--accent);font-family:var(--mono);font-weight:500}
.light{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:2.3rem;font-weight:700;border:var(--bw) solid var(--line);flex:none;color:#fff;background:var(--none);transition:background .25s}
html[data-mode=desk] .light{border-radius:2px;width:56px;height:56px;font-size:1.7rem}
.light[data-v=ok]{background:var(--ok)}.light[data-v=warn]{background:var(--warn);color:#2b1c00}.light[data-v=bad]{background:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin:.9rem 0 .2rem}
.tile{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:.6rem .7rem}
html[data-mode=desk] .tile{border-width:1px;border-radius:2px;padding:.5rem .6rem}
.tile b{display:block;font-size:1.35rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:.8em;color:var(--muted);line-height:1.25;margin-top:.15rem}
details{border-top:2px dashed var(--grid);padding:.6rem 0}
details>summary{cursor:pointer;font-weight:700;list-style-position:inside}
html[data-mode=desk] details{border-top:1px solid var(--line)}
html[data-mode=desk] details>summary{font-weight:500}
details>div{padding-top:.5rem}

/* ============ forms ============ */
.field{margin-bottom:1.15rem}
.frow{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
.frow label{font-weight:600;flex:1}
.help{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--p3,transparent);font-weight:700;cursor:pointer;line-height:1;padding:0;color:#2a0a45}
html[data-mode=desk] .help{border-radius:2px;border-width:1px;background:transparent;color:var(--muted)}
.helptxt{font-size:.88em;color:var(--muted);background:var(--soft);border-radius:12px;padding:.5rem .7rem;margin:.4rem 0 0}
.numwrap{display:inline-flex;align-items:center;gap:.2rem;border:var(--bw) solid var(--line);border-radius:14px;padding:.1rem .55rem;background:var(--card)}
html[data-mode=desk] .numwrap{border-radius:2px;background:var(--soft)}
.numwrap input{width:5.2em;border:0;background:transparent;text-align:right;font-weight:700;padding:.25rem 0;outline:none}
.numwrap:focus-within{outline:3px solid var(--p5,#ffb000)}
.numwrap i{font-style:normal;color:var(--muted);min-width:1ch}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:99px;background:var(--track);border:2px solid var(--line);margin:.25rem 0;cursor:pointer}
html[data-mode=desk] input[type=range]{height:6px;border-radius:0;border-width:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--p3,#ffb000);border:3px solid var(--line);box-shadow:0 3px 0 var(--line)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--p3,#ffb000);border:3px solid var(--line)}
html[data-mode=desk] input[type=range]::-webkit-slider-thumb{width:12px;height:18px;border-radius:0;border-width:1px;box-shadow:none;background:var(--accent)}
html[data-mode=desk] input[type=range]::-moz-range-thumb{width:10px;height:16px;border-radius:0;border-width:1px;background:var(--accent)}
select,.txt{border:var(--bw) solid var(--line);border-radius:12px;background:var(--card);padding:.4rem .6rem;width:100%}
html[data-mode=desk] select,html[data-mode=desk] .txt{border-radius:2px;background:var(--soft)}

/* ============ playground ============ */
.hero{padding:.6rem 0 1rem}
.hero h1{font-size:clamp(1.9rem,5.4vw,3.2rem);font-weight:700;margin:0 0 .3rem;max-width:18ch}
.hero p{font-size:1.1rem;max-width:56ch;color:var(--muted)}
.play-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:1.4rem;align-items:start}
.col-in{position:sticky;top:.8rem}
.vbar{display:none;position:sticky;top:.5rem;z-index:20;align-items:center;gap:.7rem;background:var(--card);border:var(--bw) solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:.35rem .9rem .35rem .4rem;margin-bottom:1rem}
.vbar .light{width:40px;height:40px;font-size:1.3rem;box-shadow:none}
.vbar b{flex:1;line-height:1.2}
.vrow{display:flex;gap:1rem;align-items:center}
.vrow h2{font-size:1.5rem;margin:0}
.vtext{font-size:1.04rem;margin:.8rem 0 0}
.finding{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.4rem 1.2rem;padding:.9rem 0;border-top:2px dashed var(--grid);align-items:center}
.finding:first-of-type{border-top:0}
.finding h3{font-size:1.1rem;margin-bottom:.25rem}
#deeper .chart{max-width:560px}
.ex{border-top:1px solid var(--line);margin-top:.7rem;padding:.45rem 0 0}
.ex>summary{font-size:.8rem;color:var(--accent);font-family:var(--mono);cursor:pointer;font-weight:500}
.ex p{font-size:.86em;margin:.45rem 0 0;color:var(--ink);line-height:1.5}.ex p b{color:var(--muted);font-weight:600}
.rp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem 1.6rem;margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--line)}
.rp h3{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 .35rem;font-weight:600}
.rp p,.rp li{font-size:.9em;line-height:1.5;margin:0 0 .3rem}.rp ul{margin:0;padding-left:1.05rem}
@media (max-width:760px){.rp{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:1.4rem;align-items:center}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.plan{border:2px solid var(--accent);background:linear-gradient(180deg,rgba(255,176,0,.07),transparent 140px),var(--card)}
.planh{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}
.planh h2{font-family:var(--mono);font-size:1.15rem;color:var(--accent);margin:0}
.pbs{display:flex;gap:.4rem;flex-wrap:wrap}
.plan-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.pi{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.8rem;padding:.8rem .9rem;background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--c1)}
.pi[data-l=must]{border-left-color:var(--bad)}.pi[data-l=should]{border-left-color:var(--warn)}
.pn{font-family:var(--mono);font-size:1.5rem;font-weight:600;color:var(--muted);line-height:1.1}
.pih{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;margin-bottom:.3rem}.pih b{font-size:1.02rem;line-height:1.3}
.pi p{margin:0 0 .35rem;font-size:.92em;line-height:1.5}
.pb{font-family:var(--mono);font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:.08rem .45rem;border:1px solid var(--c1);color:var(--c1);white-space:nowrap}
.pb[data-l=must]{border-color:var(--bad);color:var(--bad)}.pb[data-l=should]{border-color:var(--warn);color:var(--warn)}
.pres{font-family:var(--mono);font-size:.82em!important;background:var(--bg);border:1px solid var(--line);padding:.35rem .55rem;margin-top:.4rem!important}
.pres span{color:var(--ok);font-weight:600}
@media (max-width:1100px){.plan-list{grid-template-columns:1fr}}
@media (max-width:760px){.rp{grid-template-columns:1fr}}
.ferr{color:var(--bad);font-size:.82em;font-weight:600;margin:.25rem 0 0}
.formrow+.ferr{margin:-.3rem 0 .55rem;text-align:right}
.numwrap.bad,input.txt.bad{outline:2px solid var(--bad);outline-offset:1px}
.inerr{margin-bottom:1rem;font-weight:600}
.tip{position:fixed;z-index:80;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.55);padding:.8rem .95rem;font-size:.88rem;line-height:1.55;pointer-events:none;color:var(--ink)}
.tip .tth{font-family:var(--mono);color:var(--accent);font-size:.78rem;font-weight:700;margin:0 0 .45rem;text-transform:uppercase;letter-spacing:.05em}
.tip p{margin:0 0 .5rem}.tip p b{color:var(--muted);font-weight:600}
.tip .tex{background:var(--soft);border-left:3px solid var(--accent);padding:.45rem .6rem;margin:0}.tip .tex b{color:var(--accent)}
.formrow[data-tip]{cursor:help;margin-left:-.4rem;margin-right:-.4rem;padding:.15rem .4rem}
.formrow[data-tip]>label,.formrow[data-tip]>span:first-child{cursor:help}
.cond[data-tip]{cursor:help}.cond.tipon{box-shadow:inset 2px 0 0 var(--accent)}
.btctl label[data-tip]{cursor:help}.btctl label[data-tip]>span::after{content:"?";display:inline-grid;place-items:center;width:1rem;height:1rem;margin-left:.35rem;border:1px solid var(--muted);border-radius:50%;font:600 .62rem/1 var(--mono);color:var(--muted);vertical-align:.12em}
.formrow[data-tip]>label::after,.formrow[data-tip]>span:first-child::after{content:"?";display:inline-grid;place-items:center;width:1rem;height:1rem;margin-left:.35rem;border:1px solid var(--muted);border-radius:50%;font:600 .62rem/1 var(--mono);color:var(--muted);vertical-align:.12em}
.formrow.tipon{background:var(--soft);box-shadow:inset 2px 0 0 var(--accent)}
.formrow.tipon>label::after,.formrow.tipon>span:first-child::after{border-color:var(--accent);color:var(--accent)}
.numwrap.unset:not(.bad),input.txt.unset:not(.bad){outline:2px dashed var(--warn);outline-offset:1px}
.unsetnote{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;margin-bottom:1rem;font-weight:600}
.xbar{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}.xbar>div:first-child{flex:1;min-width:16em}.xbar b{display:block;margin-bottom:.15rem}.xbtns{display:flex;gap:.5rem;flex-wrap:wrap}
.takeaway{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}.mdnote{margin:.6rem 0 0}
.unsetnote>span:first-child{flex:1;min-width:14em}.unsetnote .ubtns{display:flex;gap:.5rem;flex-wrap:wrap}
html[data-mode=play] .unsetnote .btn{padding:.35rem .9rem}
.bplan{list-style:none;margin:.7rem 0 0;padding:0;display:grid;gap:.55rem}
.bp{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.7rem;align-items:start;border:2px solid var(--line);border-left-width:7px;border-left-color:var(--p4);border-radius:16px;padding:.65rem .8rem;background:var(--soft)}
.bp[data-l=must]{border-left-color:var(--bad)}.bp[data-l=should]{border-left-color:var(--warn)}
.bpn{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--card);border:2px solid var(--line);font-weight:700}
.bph{display:flex;flex-wrap:wrap;gap:.25rem .5rem;align-items:center;margin-bottom:.15rem}.bph b{font-size:1.04rem;line-height:1.3}
.bpl{font-size:.78rem;font-weight:700;padding:.08rem .5rem;border-radius:99px;border:2px solid var(--line);background:var(--p4);color:#2a0a45;white-space:nowrap}
.bpl[data-l=must]{background:#d23439;color:#fff}.bpl[data-l=should]{background:var(--warn);color:#2b1c00}
.bp p{margin:0 0 .3rem;font-size:.95em;line-height:1.45}
.bres{display:inline-flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.25rem .6rem;font-weight:600;font-size:.88em!important;margin:.15rem 0 .35rem!important}

.crowd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin:.7rem 0}
.crg{border:2px solid var(--line);border-radius:14px;padding:.65rem .7rem;background:var(--card)}
.crh b{font-size:1rem}.crdots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:.55rem 0;max-width:260px}

.crleg{list-style:none;margin:0;padding:0;display:grid;gap:.15rem;font-size:.86rem}.crleg li{display:grid;grid-template-columns:12px 1fr auto;gap:.45rem;align-items:center}.crleg .cd{width:12px}

/* an animated pixel sprite (beginner mode only; CSS hides them in Expert). n = file in sprites/, sc = whole-number scale */

/* a fresh set of decorations on every visit: the 12 charms shuffle across the 12 decoration spots, and no spot repeats the
   charm it had last visit. The shaman's moods, the risk signs, the logo and the slime ("no edge") always mean the same thing. */
const DECO=(function(){
  const pool=['spirit_eye','spirit_hand','spirit_house','amulet_cursed','talisman_floating','prayer_beads','ritual_candle','ritual_cauldron','ritual_incense','voodoo_doll','cursed_mask','spirit_flame'];
  const slots=['altarL','altarC','altarR','inputs','fan','why','fix','deeper','nudge','foot1','foot2','foot3'];
  const ghosts=['ghost_krasue','ghost_phi_pop','ghost_mae_nak','ghost_child','ghost_skull','ghost_shadow'];
  const mix=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  let last=[];try{last=JSON.parse(localStorage.getItem('jn_deco')||'[]');}catch(e){}
  let pick=mix(pool);for(let k=0;k<200&&pick.some((n,i)=>n===last[i]);k++)pick=mix(pool);
  try{localStorage.setItem('jn_deco',JSON.stringify(pick));}catch(e){}
  const o={};slots.forEach((sl,i)=>o[sl]=pick[i]);
  const g=mix(ghosts);o.ghosts=g;o.roastGhost=g[5];
  document.querySelectorAll('[data-slot]').forEach(e=>{e.dataset.s=o[e.dataset.slot];});
  return o;})();
/* while you look at the page, two charms on screen trade places every 2.5 s (paused in Expert, behind popups and in background tabs) */
(function(){

  const slots=['altarL','altarC','altarR','inputs','fan','why','fix','deeper','nudge','foot1','foot2','foot3'];
  const seen=e=>{if(!e||e.offsetParent===null)return false;const r=e.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight;};

    if(document.hidden||document.documentElement.dataset.mode!=='play'||document.body.classList.contains('locked')||document.documentElement.classList.contains('noanim'))return;

/* ---------- basics ---------- */

function mean(a){let s=0;for(let i=0;i<a.length;i++)s+=a[i];return a.length?s/a.length:0;}
function sd(a){const n=a.length;if(n<2)return 0;const m=mean(a);let s=0;for(let i=0;i<n;i++)s+=(a[i]-m)*(a[i]-m);return Math.sqrt(s/(n-1));}
function quantile(sorted,q){if(!sorted.length)return NaN;const pos=(sorted.length-1)*q,lo=Math.floor(pos),hi=Math.ceil(pos);return sorted[lo]+(sorted[hi]-sorted[lo])*(pos-lo);}

const expectancy=(p,b)=>p*b-(1-p);

  const k=kelly(p,b);if(k<=0)return 0;let lo=k,hi=0.999;if(growth(hi,p,b)>0)return hi;

/* ---------- trade-list statistics ---------- */

/* ---------- Myfxbook CSV ---------- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);

/* ---------- grid / martingale / no-stop: one cycle = first order until the basket closes ----------

  const dd=new Float64Array(sims),fin=new Float64Array(sims),ruinAt=new Int32Array(sims),wipeAt=new Int32Array(sims),curves=[];let ruined=0,wiped=0;

ro_kick:"I'm Jarn Neow, spirit doctor for dying trading accounts.",ro_t:"So you know how to trade?",ro_p:"Then why does the margin call keep calling you? 📞",ro_1:"Win rate 90%. Balance: 0.",ro_2:"\"One more trade and I'll win it all back.\"",ro_3:"Stop loss? Never heard of her.",ro_no:"…okay, help me",ro_jk:"Breathe. Your account can still be saved.",ro_jk_p:"Every trader who lasts learned this the hard way. Answer 2 quick questions and 5 tiny quizzes (about a minute) and you'll know how to keep yours alive.",ro_go:"Let's go",tu_kick:"Quick tour · {i} of {n}",tu_skip:"Skip tutorial",tu_prev:"Back",tu_next:"Next",tu_done:"Put in my numbers",tu_again:"Show me around again",tu_in_t:"Start here: your numbers",tu_in_1:"These four numbers describe your strategy. Right now they're examples, so the result below isn't about you yet.",tu_in_2:"Type in a box or drag a slider. Use the numbers from your own backtest or forward test, not the ones you hope for.",tu_in_3:"Not sure what one means? Tap the yellow ? next to it for a short explanation with an example.",tu_in_3h:"Not sure what one means? Point at it and a short explanation with an example pops up, like this one.",tu_v_t:"Your verdict",tu_v_1:"The answer in a few words: “{ok}”, “{warn}” or “{bad}”. It changes the moment you change a number.",tu_v_2:"The boxes underneath are the details: average profit per trade, the chance of blowing the account, and the typical worst drop.",tu_f_t:"Possible futures",tu_f_1:"Each thin line is one way your next trades could go, built from your numbers. Same strategy, different luck.",tu_f_2:"A line turns red when the account loses half. The thick line is the typical path. Fewer red lines means a safer strategy.",tu_w_1:"The reasons behind the verdict, in plain words: whether you risk too much per trade, and whether you have enough trades to trust the numbers.",tu_x_1:"Your to-do list, most important first. Start at the top: that one step usually matters more than all the rest.",tu_s_1:"Download a report, copy a link that opens with your numbers, or copy the text to paste into your notes.",tu_r_t:"Optional: readiness check",tu_r_1:"6 quick questions on lot size, stop loss, leverage and losing streaks. Get one wrong and you'll see a short lesson. Skip it if you like.",tu_m_t:"Want more?",tu_m_1:"Expert mode adds costs, lot size and your own trade history. Switch any time: your numbers come with you.",tu_m_2:"That's the tour. Now put in your own numbers and see what your strategy really does.",pi_kick:"One more thing before you start.",pi_t:"Got a strategy that actually works?",pi_p:"Fast money, steady every month, a high win rate: the kind everyone talks about and nobody shows. If you really have one, send me the stats. I want to run the numbers and check it myself.",pi_l_link:"Link to your stats",pi_h_link:"Myfxbook, FX Blue, a broker statement, a spreadsheet: anything I can open.",pi_l_contact:"How do I reach you?",pi_h_contact:"Email, LINE or Telegram.",pi_l_note:"Questions or comments? (optional)",pi_priv:"Only I see this. Nothing gets posted.",pi_asap:"I'll send you a report ASAP. (As Slow As Possible. Kidding. Mostly.)",pi_send:"Send it",pi_later:"Not now",pi_need_link:"Add a link or describe where your stats are.",pi_need_contact:"Add a way to reach you.",pi_err:"Couldn't send. Check your connection and try again.",pi_off:"Sending isn't switched on yet.",pi_sending:"Sending…",pi_done_t:"Got it.",pi_done_p:"I'll check the numbers and get back to you with a report.",pi_cont:"Continue",rd_kick:"Readiness check",rd_intro_t:"Ready to trade real money?",rd_intro_p:"6 questions on what blows up beginner accounts: lot size, stop loss, leverage, losing streaks, backtesting and forward testing. Get one wrong and you'll see a short lesson right away. About 2 minutes.",rd_intro_s:"Better to find out here than with real money.",rd_start:"Start",rd_n:"Question {i} of {n}",rd_next:"Next",rd_back:"Back",rd_see:"See my result",rd_toresult:"Back to result",rd_done:"Done",rd_retry:"Try again",rd_close:"Close",rd_anyway:"Show the lesson anyway",rd_k1:"Lot size",rd_k2:"Stop loss",rd_k3:"Leverage and margin",rd_k4:"Losing streaks",rd_k5:"Backtesting",rd_k6:"Forward testing",rd_q1:"Your account is $1,000. You want to risk 1% ($10) on a {sym} trade with a stop loss {stop} away. What lot size do you open?",rd_q1_a:"0.05 lot",rd_q1_b:"0.50 lot",rd_q1_c:"1.00 lot",rd_q1_r:"Right. $10 ÷ ({stop} × {per1} for 1 lot) = {lot} lot.",rd_q1_w:"Too big. At the stop, 0.50 lot loses {m1} ({p1} of the account) and 1.00 lot loses {m2} ({p2}).",rd_l1_p:"Lot size comes from how much you're willing to lose, not from a feeling. On {sym}, 1.00 lot moves about {per1}, 0.10 lot {v10} and 0.01 lot {v100}.",rd_l1_f:"Lot size = money you risk ÷ (stop in {u} × {per1})",rd_acc:"Account",rd_riskp:"Risk per trade",rd_stop:"Stop loss",rd_pips:"{n} pips",rd_l1_o:"Risk {r}, so open",rd_l1_o2:"With 1.00 lot instead, this stop would cost {m}: {p} of the account.",rd_l1_tiny:"Under 0.01 lot: this stop is too wide for the account. Use a tighter stop or skip the trade.",rd_q2:"Price is {near} from your stop loss. You feel sure it will turn around. What do you do?",rd_q2_a:"Move the stop further away to give it room",rd_q2_b:"Remove the stop until price comes back",rd_q2_c:"Leave the stop where it is",rd_q2_r:"Right. The stop is where you decided, calmly, that the idea is wrong. Let it do its job.",rd_q2_w:"That's how a 1% loss turns into 10%. The market doesn't care where you got in.",rd_l2_p:"You set the stop before the trade, while you were calm. Moving it once makes the next time easier, and one trade without a real stop can wipe out weeks of wins.",rd_l2_ctl:"Pips you move the stop away",rd_l2_plan:"Planned loss",rd_l2_now:"Loss after moving it",rd_l2_n:"That one trade now costs as much as {n} normal losses.",rd_l2_0:"Stop left alone: the loss stays at $10.",rd_l2_note:"Example: $1,000 account, {lot} lot {sym}, stop {stop} away.",rd_q3:"$1,000 account, {lot} lot on {sym}. Your broker offers 1:50 or 1:500 leverage. What changes between them?",rd_q3_a:"1:500 makes 10 times more on every price move",rd_q3_b:"Only the margin the broker holds. What you make or lose on each move stays the same",rd_q3_c:"1:500 is safer because it uses less margin",rd_q3_r:"Right. Leverage doesn't change the risk of a trade. It changes how big a trade you're allowed to open.",rd_q3_w:"Not quite. At {lot} lot you make or lose {perl} at any leverage.",rd_l3_p:"Leverage is a borrowing limit. Higher leverage holds less margin per trade, so it lets you open far bigger trades than the account can survive. When losses eat up your free margin, the broker closes your trades for you: that's the margin call and stop out.",rd_l3_ctl:"Leverage",rd_l3_m:"Your {lot} lot trade: the broker holds {m} as margin. You still make or lose {perl}.",rd_l3_max:"Biggest trade the broker lets you open",rd_l3_zero:"That trade wipes out the account after a move of about",rd_l3_note:"Example price: {sym} at {px}. Real brokers close trades before zero, so it happens even sooner.",rd_q4:"Your strategy wins 45% of its trades. Over the next 200 trades, what's the longest losing streak you should be ready for?",rd_q4_a:"2 or 3 in a row",rd_q4_b:"5 at most",rd_q4_c:"8 or more in a row",rd_q4_r:"Right. At 45%, about 8 losses in a row is typical somewhere in 200 trades, and 11 or more happens about 1 time in 10.",rd_q4_w:"Not quite. Long streaks are normal even for good strategies. At 45%, about 8 in a row is typical over 200 trades.",rd_l4_p:"A losing streak doesn't mean the strategy broke. Whether you survive it depends on your risk per trade.",rd_l4_ctl:"Win rate",rd_l4_s:"Typical longest losing streak in 200 trades: {s} in a row. 1 time in 10 it's {p} or more.",rd_l4_b:"How far the account falls after {s} losses in a row, risking:",rd_l4_per:"{r} per trade",rd_q5:"You checked your strategy on 10 past trades and 7 were winners. What does that tell you?",rd_q5_a:"It works: a 70% win tip_n_w:"How many trades your win rate and reward : risk come from.",tip_n_y:"With few trades, good numbers can be pure luck. This tells the tool how sure it can be and how many more trades you need.",tip_n_e:"A 3-week forward test at 2 trades a day is about 30 trades, so type 30.",
tip_tpd_w:"How many trades you take on an average trading day.",tip_tpd_y:"It turns trade counts into calendar time, so the tool can say “370 more trades is about 185 days”.",tip_tpd_e:"About 10 trades a week over 5 trading days: type 2. One trade every two days: type 0.5.",
tip_risk_w:"How much of your account you lose when a trade hits its stop loss, as a percentage.",tip_risk_y:"This is the biggest single factor in whether the account survives. Too high, and a normal losing run can wipe you out.",tip_risk_e:"A $10,000 account that loses $100 when stopped out: 100 ÷ 10,000 = 1%, so type 1.",
tip_sizing_w:"“% of current balance” works out the risk from today's balance, so positions shrink after losses and grow after wins. “% of starting balance” always risks the same amount of money.",tip_sizing_y:"Sizing from the current balance protects you during bad runs. Sizing from the starting balance keeps the same money at risk even after the account has shrunk.",tip_sizing_e:"You start with $10,000 at 1% and fall to $8,000. Current-balance sizing now risks $80; starting-balance sizing still risks $100.",
tip_dafter_w:"A safety rule: after this many losses in a row, risk less until your next win. Type 0 to turn it off.",tip_dafter_y:"It makes bad runs shallower without changing the strategy itself.",tip_dafter_e:"Type 3 with “cut risk by 50”: after 3 straight losses you risk 0.5% instead of 1% until a trade wins.",
tip_dcut_w:"How much to reduce risk while the rule above is active.",tip_dcut_y:"Bigger cuts protect more, but the account also climbs back more slowly.",tip_dcut_e:"50 means half size: 1% becomes 0.5%. 25 means 1% becomes 0.75%.",
tip_bal_w:"The money in your trading account right now.",tip_bal_y:"It is used only to turn your risk % into money and a lot size. The survival results are in percent, so they do not depend on it.",tip_bal_e:"For a $10,000 account, type 10000. Use the account's own currency.",
tip_sl_w:"How far your stop loss sits from your entry, measured in pips or points. This is a price distance, not money, and it defines 1R.",tip_sl_y:"It is needed for costs and lot size. With a CSV, it must use the same unit as the file's Pips column.",tip_sl_e:"EURUSD: entry 1.0850, stop 1.0830, so 20 pips: type 20. Gold: entry 4,050.00, stop 4,037.50, a $12.50 move, which Myfxbook counts as 1,250 points: type 1250.",
tip_spread_w:"The gap between the buy and sell price that you pay on every trade, in the same unit as the SL.",tip_spread_y:"Spread is paid on winners and losers alike. On short-term strategies it can eat most of the edge.",tip_spread_e:"EURUSD spread of 0.8 pips with a 20-pip stop: each trade loses 0.04R to spread. Type 0.8.",
tip_comm_w:"The commission your broker charges per 1.0 lot for opening and closing together (round turn). Type 0 if your broker charges only spread.",tip_comm_y:"Like spread, it is paid on every trade, win or lose.",tip_comm_e:"Your broker charges $3.50 per lot each way, so round turn is $7. Type 7.",
tip_pv_w:"How much money a one-unit price move is worth on 1.0 lot, using the same unit as your SL.",tip_pv_y:"It is needed to turn commission into R and to work out your lot size. A CSV upload fills it in for you.",tip_pv_e:"EURUSD standard lot: 1 pip = $10, so type 10. Gold with Myfxbook points: a $0.01 move on 1.0 lot (100 oz) = $1, so type 1.",
tip_hor_w:"How many future trades each simulation runs.",tip_hor_y:"A longer horizon gives losing runs more chances to appear, so the risk numbers grow.",tip_hor_e:"At 2 trades a day, 200 trades is about 5 months. Type 500 for roughly a year.",
tip_ruin_w:"How big a fall from your starting balance counts as “blown”.",tip_ruin_y:"Most people stop trading long before they lose everything. Set it to the loss you could not live with.",tip_ruin_e:"50 means the account counts as ruined if it falls to half its starting value. Many traders choose between 30 and 50.",
tip_sims_w:"How many random futures are simulated for the main results. It is fixed at 10,000.",tip_sims_y:"More futures give steadier numbers. At 10,000, results barely change from one run to the next.",tip_sims_e:"A 2% chance of ruin means about 200 of the 10,000 futures fell to the ruin level.",
tip_net_w:"Whether results from your file include swap and commission (net) or ignore them (gross, price movement only).",tip_net_y:"Net is what actually reached your account, so it is the honest choice.",tip_net_e:"A trade made 100 pips but paid $5 in swap. Gross counts only the 100 pips; net also subtracts the $5.",
tip_sym_w:"Which instrument from your file to analyse. One SL distance applies at a time, so instruments are analysed one by one.",tip_sym_y:"Pips mean different things on different instruments, so mixing them would give wrong R values.",tip_sym_e:"Your file has GOLD and EURUSD. Pick GOLD and enter its SL in points, then switch to EURUSD and enter its SL in pips.",

il_c_tip_week:"1 week = 5 trading days. 10% a day compounds: each day's gain is added to the balance, so the next 10% is taken from a bigger number. $1,000 is already $1,611, up 61% in one week.",

il_c_tip_6m:"6 months = about 132 trading days. $1,000 becomes $291 million. To keep going, every trade would need to be huge, far bigger than the market can easily absorb.",
il_c_tip_year:"1 year = about 250 trading days. $1,000 becomes $22.3 trillion, dozens of times more than the richest person in the world owns. This is why '10% a day' can't be a repeatable skill.",

al loss.",det_now:"You switched to {type}; the inputs are filled for that type.",det_use:"Use {type} instead",file_multi_g:"This account ran grids on {k} pairs, and up to {c} had a cycle open at the same moment. This page analyses {sym} alone with the whole balance of {bal}. Losses on several pairs often come together, so the real risk to the account is higher than shown. To get closer, enter {sym}'s share of the balance, for example {bal} ÷ {k} = {share}.",file_applied_g:"Filled from {sym}'s {c} cycles ({from} to {to}): first order {lot} lots (cycles started between {lo} and {hi} lots); {grow}; distance between orders {step} pips (single gaps ranged from {glo} to {ghi} pips; the average spacing across the ladder is used); up to {max} orders (the most seen in the file; your EA may allow more); take-profit {tp} pips from the average price; commission {comm} per lot; value per pip {pv}; balance {bal}. The daily range isn't in the file, so it stays as entered. Edit any of them.",file_applied_ns:"Filled from {sym}'s {n} trades ({from} to {to}): position size {lot} lots, take-profit {tp} pips, commission {comm} per lot, value per pip {pv}, balance {bal}. The daily range isn't in the file, so it stays as entered. Edit any of them.",file_applied_g1:"Filled from {sym}'s {n} trades ({from} to {to}): first order {lot} lots, take-profit {tp} pips, commission {comm} per lot, value per pip {pv}, balance {bal}. These trades never had more than one order open at a time, so spacing, lot growth and order count can't be read from the file and stay as entered. If this isn't a grid, switch the type above.",file_nofit:"Couldn't read the grid settings from this symbol's trades: it needs at least 5 trades with open and close prices.",grow_add:"each new order adds {x} lots",grow_mult:"each new order is {x}× the one before",gr_scaled:"money rescaled to a first order of {lot} lots",gr_when:"Your history runs from {from} to {to}; the worst real cycle ended on {w} and the deepest floating loss sc_title:"Expert mode: what it can and can't do",
sc_intro:"Read this once before relying on any number here. Expert mode measures risk: how likely a strategy is to survive, how deep the falls can get, and what size keeps the risk acceptable. It can't tell you whether a strategy will make money, and every result is only as good as the numbers you enter.",
sc_type_h:"First, pick the strategy type that matches how you really trade",
sc_types:[["Fixed stop","One trade at a time, a stop loss set when each trade opens, and about the same % of the account risked every time. Most manual strategies and many EAs."],["Grid / martingale / averaging down","You add orders as price moves against you (same size or bigger) and close them all together at a profit target."],["No hard stop","One position without a stop loss, held until price comes back or until a pain point you choose."],["None of these","Use the closest type and check the list below for what will be off. An EA isn't a type by itself: what matters is how it trades."]],
sc_can_h:"What it can do",
sc_can:[["Fixed-stop strategies","Turns win rate, reward:risk and risk per trade into expectancy with a 95% confidence interval, chance of ruin, drawdown ranges, losing-streak odds, Kelly-based sizing, cost impact and lot size, using 10,000 simulated futures."],["How sure your edge is","Shows how the result changes if your true win rate is lower than your sample suggests, and how many trades you need before the edge is statistically clear."],["Grid, martingale and averaging down","Simulates thousands of price paths through your exact grid: order spacing, lot multiplier, number of orders, profit target and optional final stop. It shows how often cycles win, how big the rare loss is, how far price must move to wipe out the account, the chance of ruin, and which first-order size is safer."],["No hard stop","The same engine for one position without a stop: how far price can go against you before the account is gone, and how often that happens at your size."],["Costs","Spread and commission are in every result. In the grid and no-stop types they're charged on every order."],["Myfxbook history (fixed-stop type)","Converts closed trades into R multiples, resamples them, and checks behaviour: losses bigger than the stop, lot-size consistency, hour and weekday patterns. It also fills in the inputs for you."],["What-if sliders and explanations","On fixed-stop charts, sliders change one input and the chart and its explanation update live. Every card says what it shows, what it means now and what to do."]],
sc_cant_h:"What it can't do",
sc_cant:[["Strategies it doesn't model",[["Variable exits","Trailing stops, partial take-profits, moving the stop to break-even, time exits. The fixed-stop model uses one average win size, so ruin and streak numbers stay roughly right, but growth figures are less reliable, especially for trend systems that live on a few very large winners."],["Several positions open at once","Baskets, hedging, correlated pairs traded together (EURUSD with GBPUSD, say), pyramiding or scaling in. Each trade is treated as separate, but correlated positions tend to lose together. Workaround: enter the total risk of everything you'd have open together as the risk per trade."],["Size that changes with results","Bigger size after wins (anti-martingale), size by confidence or feel, or any rule other than the built-in de-risk rule. Growing lots are modelled only in the grid type."],["Two-way and multi-pair grids","The grid type follows one direction per cycle. Grids that open buys and sells together, or run on several pairs at once, aren't modelled."],["Speed-sensitive strategies","High-frequency scalping, arbitrage and latency trading depend on execution speed, requotes and slippage, and none of that is in the inputs."],["Other instruments","Options, futures rollovers and crypto funding rates aren't modelled. Gold, indices and crypto CFDs work in the fixed-stop type only if every distance uses the same unit as the stop."]]],
["Costs and account mechanics it leaves out",[["Swap (overnight financing)","Not included anywhere. It matters for trades held for days, carry trades and grids that stay open for weeks, and it can turn a small edge negative."],["Slippage and gaps in the fixed-stop type","Every loss is assumed to be exactly the stop plus costs. Weekend gaps, news spikes and thin markets can make real losses bigger. The grid and no-stop types include occasional jumps, but only in a stylised way."],["Margin, leverage and stop-out","Margin isn't checked. Brokers usually close positions when the margin level falls to a set level (often 20–50%), so a real account is closed out before the 'wiped out' point shown in the grid and no-stop types. Set the ruin line at your stop-out level."],["Deposits, withdrawals, taxes and fees","The balance changes only through trading. Withdrawals shrink the buffer and make ruin more likely."],["Account currency","Money figures assume the value per pip you enter is in your account currency. If it's wrong, every lot size and money figure is wrong."]]],
["Limits of the statistics",[["The future may not match your numbers","Everything assumes your win rate, payoff and costs stay the same. Markets change and strategies stop working; the app can stress-test that but can't predict it. The confidence interval covers luck in a small sample, not a market that changes."],["Independent trades","Fixed-stop trades are simulated as independent. Real losing streaks can cluster (a bad month for your style), so real streaks and drawdowns can be longer."],["Small samples","Under about 30 trades the uncertainty is huge; under 100, treat every number as a rough guide."],["Backtest quality","The app can't see overfitting, look-ahead bias, unrealistic fills or cherry-picked periods. Unrealistic inputs give confident, wrong answers."],["Price model in the grid and no-stop types","Prices are simulated from the daily range you enter, as a plain random walk or with fat tails and short trends. They aren't fitted to your pair's history, and they have no edge in either direction, so a real edge such as mean reversion won't show up. Real markets have moved far beyond both models (the Swiss franc in January 2015, for example)."],["Simulation noise","Results come from random simulations, so they shift a little between settings. Events rarer than about 1 in 1,000 may not appear: 0% means 'not seen in the simulation', not 'impossible'."]]],
["Myfxbook import",[["Closed trades only","Open positions, pending orders and floating losses at export time are ignored, so an account carrying a large open loss can look healthy."],["Estimated stop","If you don't know the stop, it's estimated from the median losing trade, so R values are approximate."],["Strategy detection is a best guess","The type is detected from stop losses, trades that close together and growing lot sizes. Hand-closed grids or EAs that close orders one by one can be misread, so check the detected type and switch it if needed. Grid settings are rebuilt from the trades: uneven spacing becomes one average spacing, and the most orders seen may be fewer than your EA allows."],["Mixed accounts","Several strategies or EAs on one account are blended into one set of statistics. Pick one symbol, or export one strategy per file."]]],
["What it isn't",[["Not a profit predictor or a signal","It never tells you what, when or whether to trade. A good result means 'survivable if your numbers are true', not 'profitable'."],["Not a test of you under pressure","It assumes the rules are followed exactly. Fear, revenge trading, moved stops, platform outages and broker problems aren't modelled."],["Not financial advice","Jarn Neow is an educational tool. Trading leveraged products carries a high risk of loss."]]]],

<script id="s-chfit">

const CHFIT=(function(){
  function fit(){const desk=document.documentElement.dataset.mode==='desk',target=desk?11:12,base=desk?10:11,cap=base*2.2;
    document.querySelectorAll('.chart svg').forEach(svg=>{const w=svg.getBoundingClientRect().width,vb=svg.viewBox&&svg.viewBox.baseVal;if(!w||!vb||!vb.width)return;
      const f=Math.min(cap,Math.max(base,target*vb.width/w)).toFixed(2)+'px';if(svg.style.getPropertyValue('--cf')!==f)svg.style.setProperty('--cf',f);});}
  let raf=0;const q=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;fit();});};
  new MutationObserver(q).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['data-mode','hidden','open']});
  addEventListener('resize',q);return{fit};})();

<script id="s-play">
/* ---------- shared helpers ---------- */

/* ---------- Markdown report helpers (shared by both modes) ---------- */
const MD=(function(){
'use strict';
const tx=(en,th)=>LANG==='th'&&th!==undefined?th:en;
const strip=s=>String(s==null?'–':s).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");

const kv=(rows,h)=>table(h||[tx('Measure','ค่าที่วัด'),tx('Value','ค่า')],rows);
/* a text bar, so the numbers keep a picture in any Markdown viewer */
function bar(v,max,w){w=w||20;if(!(max>0)||!isFinite(v))return'';const n=Math.max(0,Math.min(w,Math.round(v/max*w)));return'█'.repeat(n)+'░'.repeat(w-n);}
const h=(n,s)=>'\n'+'#'.repeat(n)+' '+strip(s)+'\n\n';
const p=s=>s?strip(s)+'\n\n':'';

const list=a=>a.filter(Boolean).length?a.filter(Boolean).map(x=>'- '+strip(x)).join('\n')+'\n\n':'';
const check=a=>a.filter(Boolean).length?a.filter(Boolean).map(x=>'- [ ] '+strip(x)).join('\n')+'\n\n':'';
const pad=n=>String(n).padStart(2,'0');
function stamp(){const d=new Date(),o=-d.getTimezoneOffset(),sg=o>=0?'+':'−',oh=Math.floor(Math.abs(o)/60),om=Math.abs(o)%60;

function download(name,text){

function flash(btn,key){if(!btn)return;btn.textContent=t(key);clearTimeout(btn._ft);btn._ft=setTimeout(()=>{btn.textContent=t(btn.dataset.i18n);},1800);}
function copy(text,btn){

const appUrl=()=>location.protocol==='file:'?'https://0xtrvkc.github.io/Jarn-Neow/':location.href.split('#')[0];
/* labels from the page itself, so the report matches the form word for word */
const label=id=>{const l=document.querySelector('label[for="'+id+'"]');return l?l.textContent.trim():id;};
const optText=id=>{const s=$(id);return s&&s.selectedIndex>=0?s.options[s.selectedIndex].textContent.trim():'';};
const glossary=()=>[
  [tx('R (risk unit)','R (หน่วยความเสี่ยง)'),tx('The amount you lose when the stop is hit. A +1.5R win earns 1.5 times what one full loss costs.','จำนวนเงินที่เสียเมื่อโดน Stop loss ไม้ที่ได้ +1.5R ได้กำไร 1.5 เท่าของการขาดทุนเต็มหนึ่งไม้')],
  [tx('Expectancy, E[R]','ค่าคาดหวัง E[R]'),tx('The average result per trade in R, after costs. Above zero means the strategy earns over many trades; below zero means it loses.','ผลเฉลี่ยต่อไม้ในหน่วย R หลังหักต้นทุน มากกว่าศูนย์แปลว่าระยะยาวได้กำไร น้อยกว่าศูนย์แปลว่าระยะยาวขาดทุน')],
  [tx('95% confidence interval','ช่วงความเชื่อมั่น 95%'),tx('The range the true value probably sits in, given how many trades back the estimate. Fewer trades give a wider range.','ช่วงที่ค่าจริงน่าจะอยู่ ขึ้นกับจำนวนไม้ที่ใช้ประเมิน ยิ่งไม้น้อย ช่วงยิ่งกว้าง')],
  [tx('Ruin','พอร์ตแตก (Ruin)'),tx('Falling below the ruin line you set (for example −50% from the start). Most traders stop or change the strategy long before 100% is lost.','ทุนลดลงต่ำกว่าเส้นที่ตั้งไว้ (เช่น −50% จากทุนเริ่มต้น) เทรดเดอร์ส่วนใหญ่หยุดหรือเปลี่ยนกลยุทธ์ก่อนเสียหมด 100%')],
  [tx('Drawdown','Drawdown (การย่อตัวของทุน)'),tx('The fall from the highest balance so far to a later low. "p95 drawdown" is the fall that only 1 future in 20 is worse than.','การลดลงจากจุดสูงสุดของทุนไปยังจุดต่ำในภายหลัง "Drawdown p95" คือระดับที่มีเพียง 1 ใน 20 อนาคตที่แย่กว่า')],
  [tx('Percentiles (p5, p50, p95)','เปอร์เซ็นไทล์ (p5, p50, p95)'),tx('p50 is the middle (median) outcome. p5 is a bad case: 5% of simulated futures end lower. p95 is a good case.','p50 คือผลกลาง (ค่ามัธยฐาน) p5 คือกรณีแย่ มี 5% ของอนาคตจำลองที่จบต่ำกว่านี้ p95 คือกรณีดี')],
  [tx('Monte Carlo simulation','การจำลอง Monte Carlo'),tx('Thousands of possible futures generated at random from your numbers. It shows the spread of outcomes, not one forecast.','สร้างอนาคตที่เป็นไปได้หลายพันแบบแบบสุ่มจากตัวเลขของคุณ เพื่อดูการกระจายของผลลัพธ์ ไม่ใช่การทำนายค่าเดียว')],
  [tx('Kelly fraction (f*)','สัดส่วน Kelly (f*)'),tx('The risk per trade that grows the account fastest in theory. Real traders use a half or a quarter of it, because the true edge is uncertain and swings at full Kelly are brutal.','ความเสี่ยงต่อไม้ที่ทำให้ทุนโตเร็วที่สุดในทางทฤษฎี เทรดเดอร์จริงใช้ครึ่งหนึ่งหรือหนึ่งในสี่ เพราะ Edge จริงไม่แน่นอน และการแกว่งที่ Kelly เต็มรุนแรงมาก')],
  [tx('Break-even win rate','อัตราชนะที่คุ้มทุน'),tx('The win rate at which expectancy is exactly zero for your reward : risk and costs.','อัตราชนะที่ทำให้ค่าคาดหวังเป็นศูนย์พอดี สำหรับ Reward : Risk และต้นทุนของคุณ')],
  [tx('Profit factor','Profit factor'),tx('Total money won divided by total money lost. Above 1 is profitable.','กำไรรวมหารด้วยขาดทุนรวม มากกว่า 1 แปลว่ามีกำไร')],
  [tx('Grid cycle','รอบกริด'),tx('Everything from the first order until all orders close together at the target, the final stop or a wipe-out.','ทุกอย่างตั้งแต่ออเดอร์แรกจนทุกออเดอร์ปิดพร้อมกันที่เป้า ที่ Stop สุดท้าย หรือพอร์ตแตก')],
  [tx('Floating loss / MAE','ขาดทุนลอยตัว / MAE'),tx('The open loss while positions are still running. MAE (maximum adverse excursion) is the deepest it got.','ขาดทุนที่ยังเปิดค้างอยู่ระหว่างถือออเดอร์ MAE คือจุดที่ขาดทุนลึกที่สุด')],
  [tx('Average daily range (ADR)','ช่วงราคาเฉลี่ยต่อวัน (ADR)'),tx('How far price typically travels from the day\'s low to its high.','ระยะที่ราคามักเดินจากจุดต่ำสุดถึงจุดสูงสุดของวัน')],
  [tx('Wilson interval','ช่วง Wilson'),tx('A standard way to put a confidence range around a win rate measured on a limited number of trades.','วิธีมาตรฐานในการหาช่วงความเชื่อมั่นของอัตราชนะที่วัดจากจำนวนไม้จำกัด')],
  [tx('Bootstrap','Bootstrap'),tx('Re-drawing your own trades at random thousands of times to see how much the average could vary by luck.','สุ่มหยิบไม้จริงของคุณซ้ำหลายพันครั้ง เพื่อดูว่าค่าเฉลี่ยอาจแกว่งเพราะโชคได้แค่ไหน')]];
return{tx,strip,cell,table,kv,bar,h,p,quote,list,check,stamp,download,copy,flash,appUrl,label,optText,glossary};
})();

/* ---------- Playground (beginner) ---------- */
const PLAY=(function(){
'use strict';
const DEF={wr:45,rr:1.5,risk:5,n:40};

/* spirits: the shaman's mood, the risk sign, a visitor when the verdict changes, and the ghosts in the margins all follow the verdict */

const GHOSTS=['ghost_krasue','ghost_phi_pop','ghost_mae_nak','ghost_child','ghost_skull','ghost_shadow'];
let lastSp=null,spN=0;
function spirits(a){
  const k=a.v+(a.v==='bad'&&a.E<=0?'0':''),h=$('haunt'),L=HAUNT[a.v]||[];
  if(h)h.querySelectorAll(':scope>span').forEach((w,i)=>{const n=L[i];if(n){if(w.dataset.n!==n){w.dataset.n=n;w.innerHTML=SPR(n,2);}w.classList.add('on');}else w.classList.remove('on');});

const FIELDS={wr:{min:5,max:100,step:0.1},rr:{min:0.2,max:100,step:0.01},risk:{min:0.1,max:100,step:0.01},n:{min:5,max:1000,step:1}};

function roundTo(v,step){const d=step<1?Math.round(-Math.log10(step)):0;return +(Math.round(v/step)*step).toFixed(d);}
function renderErr(){
  const names=[];
  Object.keys(FIELDS).forEach(k=>{const bad=!!errs[k],e=$('e_'+k),w=$('n_'+k).closest('.numwrap');if(!e)return;w.classList.toggle('bad',bad);$('n_'+k).setAttribute('aria-invalid',String(bad));

function setState(v,tc){
  Object.keys(FIELDS).forEach(k=>{if(isFinite(v[k])){const f=FIELDS[k];st[k]=SFX.clamp(roundTo(v[k],f.step),f.min,f.max);}delete errs[k];if(tc)touched[k]=tc[k]?1:0;});
  example=false;before=null;$('example-badge').hidden=true;syncInputs();Object.keys(FIELDS).forEach(k=>{$('n_'+k).value=st[k];});updateHash();renderErr();return Object.assign({},st);}

/* ---------- rendering ---------- */
function sentence(a){

/* ---------- events ---------- */
function init(){

  let ktouch=false;

    f.addEventListener('pointerdown',e=>{ktouch=e.pointerType==='touch';},true);

  document.addEventListener('keydown',e=>{if(e.key==='Escape')kidHide();});
  $('share-btn').addEventListener('click',()=>{const url=shareURL(),b=$('share-btn');
    const done=()=>{b.textContent=t('share_done');setTimeout(()=>b.textContent=t('share'),1800);};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,()=>window.prompt(t('share'),url));else window.prompt(t('share'),url);});

const memo={};
